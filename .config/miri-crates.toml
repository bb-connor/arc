# Crates whose unit tests run under Miri, with the tests Miri cannot execute
# and why. Consumed by scripts/run-miri-crates.sh and .github/workflows/miri.yml;
# validated by scripts/tests/run-miri-crates.test.sh. Measured on 2026-09-26
# with the toolchain below on aarch64; the reach figures come from
# scripts/miri-unsafe-reach.py, a name-based call-chain analysis that
# over-approximates (a site it calls unreached has no chain from any test).
#
# Only two reasons put a test or a crate outside the run: it calls into C
# (Miri interprets Rust only), or it makes a syscall Miri does not implement
# (process spawning, memfd, descriptor metadata, open flags such as
# O_DIRECTORY). Anything else that fails under Miri is a finding, stays in
# the run, and is red until its owner fixes it. Each skip here is the
# `#[cfg_attr(miri, ignore = "...")]` its owner should add to the test, at
# which point the skip entry is removed.

toolchain = "nightly-2026-02-07"
# Isolation off: the tests read the clock, the environment and files.
miriflags = "-Zmiri-disable-isolation"
timeout_seconds = 1800

[[crate]]
name = "chio-guard-sdk"
unsafe_sites = 9
reached = 8

