[openshell]
version = 2

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "$SPIKE_DIR/gw/jwt/signing.pem"
public_key_path = "$SPIKE_DIR/gw/jwt/public.pem"
kid_path = "$SPIKE_DIR/gw/jwt/kid"
gateway_id = "chio-spike-gw"

[[openshell.supervisor.middleware]]
name = "chio-spike"
grpc_endpoint = "http://10.20.1.67:27601"
allow_insecure_transport = true
max_payload_bytes = 4194304
timeout = "500ms"

[[openshell.supervisor.middleware]]
name = "content-guard-example"
grpc_endpoint = "http://10.20.1.67:27606"
allow_insecure_transport = true
max_payload_bytes = 262144
timeout = "500ms"
