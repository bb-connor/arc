# Service accounts for the Chio reference runtime. Each service runs as its
# own account so a compromise of one cannot read another's state or
# credentials.
u chio-trust - "Chio trust-control service" /var/lib/chio-trust-control /usr/sbin/nologin
u chio-edge - "Chio remote MCP edge" /var/lib/chio-mcp-edge /usr/sbin/nologin
u chio-keylog - "Chio key-log witness and audit" /var/lib/chio-keylog /usr/sbin/nologin
