# Configuration and credential directories for the Chio reference runtime.
# State and runtime directories come from the units' StateDirectory= and
# RuntimeDirectory= settings; only the shared parents are declared here.
d /etc/chio 0755 root root -
# Credential sources are read by the manager as root and handed to each
# service through LoadCredential=; no service account can read them here.
d /etc/chio/credentials 0700 root root -
d /etc/chio/mcp-edge 0750 root chio-edge -
d /etc/chio/mcp-edge/launch 0750 root chio-edge -
d /etc/chio/keylog 0750 root chio-keylog -
d /var/lib/chio-keylog 0750 chio-keylog chio-keylog -
d /run/chio-keylog 0750 chio-keylog chio-keylog -
