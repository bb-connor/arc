[package]
name = "chio-outcome-ledger-comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

# A matched experiment, kept outside the production workspace. Both gates use
# one identical kernel/tool harness; only the outcome gate differs.
[workspace]

[dependencies]
chio-composed-baseline = { path = "../composed-baseline" }
chio-core-types = { path = "../../crates/core/chio-core-types" }
chio-runtime-core = { path = "../../crates/kernel/chio-runtime-core" }
chio-kernel = { path = "../../crates/kernel/chio-kernel" }
chio-store-sqlite = { path = "../../crates/platform/chio-store-sqlite" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
split-debuginfo = "off"

[profile.test]
debug = 0
split-debuginfo = "off"
