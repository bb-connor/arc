[package]
name = "chio-outcome-ledger-comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

# A matched experiment, kept outside the production workspace. Both gates use
# one identical kernel/tool harness; only the outcome gate differs.
[workspace]

[dependencies]
chio-composed-baseline = { path = "../composed-baseline" }
chio-core-types = { path = "../../crates/core/chio-core-types" }
chio-runtime-core = { path = "../../crates/kernel/chio-runtime-core" }
chio-kernel = { path = "../../crates/kernel/chio-kernel" }
chio-security-types = { path = "../../crates/security/chio-security-types" }
chio-store-sqlite = { path = "../../crates/platform/chio-store-sqlite" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
split-debuginfo = "off"

[profile.test]
debug = 0
split-debuginfo = "off"

# Match the audited sources used by the production dependency graph.
[patch.crates-io]
aws-lc-rs = { path = "../../third_party/aws-lc-rs-chio" }
regress = { path = "../../third_party/regress-chio" }
ignore = { path = "../../third_party/ignore-chio" }
nono = { path = "../../third_party/nono-upstream-chio" }
sigstore-verify = { path = "../../third_party/sigstore-verify-chio" }
enumflags2_derive = { path = "../../third_party/enumflags2-derive-chio" }
crmf = { path = "../../third_party/crmf-chio" }
cmpv2 = { path = "../../third_party/cmpv2-chio" }
seccompiler = { path = "../../third_party/seccompiler-chio" }
sigstore-merkle = { path = "../../third_party/sigstore-merkle-chio" }
sigstore-crypto = { path = "../../third_party/sigstore-crypto-chio" }
sigstore-trust-root = { path = "../../third_party/sigstore-trust-root-chio" }
