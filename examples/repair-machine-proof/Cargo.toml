[package]
name = "chio-repair-machine-proof"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["prove", "disable-dev-mode"] }
risc0-binfmt = { version = "=3.0.4", default-features = false, features = ["std"] }
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
opt-level = 3
debug = 0

[profile.release]
debug = 0
