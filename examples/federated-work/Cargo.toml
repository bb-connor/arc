[package]
name = "chio-federated-work"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false, features = ["std"] }
alloy-sol-types = { version = "1.5.7", default-features = false, features = ["std"] }
chio-core-types = { path = "../../crates/core/chio-core-types" }
chio-open-market = { path = "../../crates/economy/chio-open-market" }
chio-finding-verifier = { path = "../../crates/trust/chio-finding-verifier" }
chio-finding = { path = "../../crates/economy/chio-finding" }
base64 = "0.22"
chio-a2a-adapter = { path = "../../crates/protocol/chio-a2a-adapter" }
chio-a2a-edge = { path = "../../crates/protocol/chio-a2a-edge" }
chio-egress-contract = { path = "../../crates/protocol/chio-egress-contract" }
chio-kernel = { path = "../../crates/kernel/chio-kernel" }
chio-manifest = { path = "../../crates/platform/chio-manifest" }
chio-store-sqlite = { path = "../../crates/platform/chio-store-sqlite" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
split-debuginfo = "off"
