[package]
name = "reference-swarm"
description = "An orchestrator and two workers driving the confined reference tools through Chio edges, with the swarm authority verifying the delegation before and after the run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chio-core-types = { workspace = true }
chio-swarm-authority = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { workspace = true, features = ["blocking", "json", "query", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
