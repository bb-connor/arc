[package]
name = "chio-semantic-contracts"
description = "Pure bounded semantic contract validation for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chio-core-types = { version = "=0.2.0-alpha.1", path = "../../core/chio-core-types", default-features = false }
chio-security-types = { workspace = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[features]
default = []
std = ["chio-core-types/std", "chio-security-types/std", "serde/std"]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
