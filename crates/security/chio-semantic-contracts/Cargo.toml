[package]
name = "chio-semantic-contracts"
description = "Pure bounded semantic contract validation for Chio"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chio-core-types = { path = "../../core/chio-core-types", default-features = false }
chio-security-types = { path = "../chio-security-types", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[features]
default = []
std = ["chio-core-types/std", "chio-security-types/std", "serde/std"]
# Modeled predecessor compatibility fixtures only, never selected by wire data.
admission-test-support = []

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
