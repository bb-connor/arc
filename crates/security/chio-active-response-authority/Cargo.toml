[package]
name = "chio-active-response-authority"
description = "Pre-admitted active-response policy and artifact authority runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "chio_active_response_authority"

[[bin]]
name = "chio-active-response-authorityd"
path = "src/bin/chio-active-response-authorityd.rs"

[dependencies]
chio-control-plane = { workspace = true }
chio-core = { workspace = true }
chio-secure-ipc = { workspace = true }
chio-security-types = { workspace = true, features = ["std"] }
chio-sqlite-file-identity = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
nix = { version = "0.31.2", features = ["signal"] }
rusqlite = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chio-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
