[package]
name = "chio-cage"
description = "Verified manifest admission and retained-resource boundary for native tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[features]
real-linux-enforcement = []
enforcement-mutants = []

[dependencies]
chio-core = { workspace = true }
chio-manifest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nono-chio = { path = "../../../third_party/nono-chio" }
seccompiler = "=0.5.0"

[dev-dependencies]
chio-test-support = { workspace = true }

[[bin]]
name = "chio-cage-init"
path = "src/bin/chio-cage-init.rs"

[lints]
workspace = true
