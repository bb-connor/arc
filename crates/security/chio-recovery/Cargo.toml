[package]
name = "chio-recovery"
description = "Pure bounded recovery explanations and graph planning without execution authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chio-core-types = { version = "=0.2.0-alpha.1", path = "../../core/chio-core-types", default-features = false }
chio-security-types = { workspace = true }
chio-semantic-contracts = { version = "=0.2.0-alpha.1", path = "../chio-semantic-contracts", default-features = false }
serde = { version = "1", default-features = false }

[features]
default = []
std = ["chio-core-types/std", "chio-security-types/std", "chio-semantic-contracts/std", "serde/std"]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
