[package]
name = "chio-conformance-verdict-matrix"
description = "Scenario corpus and drivers for Chio cross-SDK verdict comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/chio"
publish = false

[lib]
name = "chio_conformance_verdict_matrix"
path = "src/lib.rs"

# Standalone workspace root. chio-conformance compiles these sources through
# `#[path]` test targets, so this crate cannot also be a root workspace member;
# `cargo check --manifest-path verdict_matrix/Cargo.toml` resolves its own
# dependencies.
[workspace]

[patch.crates-io]
aws-lc-rs = { path = "../../../../third_party/aws-lc-rs-chio" }

[dependencies]
chio-core = { package = "chio-core-types", path = "../../../core/chio-core-types" }
chio-kernel = { path = "../../../kernel/chio-kernel" }
chio-kernel-browser = { path = "../../../kernel/chio-kernel-browser" }
chio-test-support = { path = "../../chio-test-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
thiserror = "1"
toml = "0.8"
async-trait = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
