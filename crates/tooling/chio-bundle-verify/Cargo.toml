[package]
name = "chio-bundle-verify"
description = "Offline verifier for exported Chio evidence bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

[lib]
name = "chio_bundle_verify"

[[bin]]
name = "chio-verify"
path = "src/bin/chio-verify.rs"

[dependencies]
chio-core-types = { workspace = true }
chio-errors = { workspace = true }
chio-kernel-core = { workspace = true }
chio-security-types = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[features]
# Hybrid post-quantum receipt signatures.
pq = ["chio-core-types/pq"]

[dev-dependencies]
chio-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
