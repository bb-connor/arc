[package]
name = "chio-federation"
description = "Chio federation quorum, admission, and reputation-clearing contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_federation"

[features]
pq = ["chio-core-types/pq"]
# Stub selective-disclosure auditor-view feature. Default-off so the
# baseline chio build stays BBS+/BLS12-381-free. The feature gate is
# named `bbs-stub` (NOT `zk`) because the implementation under it is a
# SHA-256-commitment placeholder for projection and disclose/withhold
# bookkeeping only. It does not provide BBS+, zk, or privacy-preserving
# cryptographic behavior; a separately named real-BBS feature can be
# introduced when that implementation exists.
# See selective_disclosure.rs module docs.
bbs-stub = []

[dependencies]
chio-core-types = { path = "../chio-core-types" }
chio-listing = { path = "../chio-listing" }
chio-metrics-spec = { workspace = true }
chio-open-market = { path = "../chio-open-market" }
chio-revocation-oracle = { path = "../chio-revocation-oracle" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# DSSE signature-slice local profile. The producer serialises the
# canonical-JSON in-toto Statement as Base64 in the wire payload and binds
# keyid as SHA-256 of the passport public key (hex-encoded, via the `hex`
# crate). These three deps are used exclusively by `bilateral_dsse.rs`.
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Integration test crates/chio-federation/tests/oracle_gossip_e2e.rs walks
# a single-host gossip mesh end-to-end and asserts the oracle-insert to
# verifier-visibility latency budget. The kernel-core RevocationView is
# the verifier-side surface so that crate is pulled in here as a dev
# dependency only.
chio-kernel-core = { path = "../chio-kernel-core" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
