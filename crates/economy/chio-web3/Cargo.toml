[package]
name = "chio-web3"
description = "Chio web3 settlement, anchoring, and contract-surface artifacts"
version.workspace = true
edition.workspace = true
# Kani 0.67 uses Rust 1.93; this formal-proof crate remains compatible.
rust-version = "1.93"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_web3"

[features]
default = []
kani = []

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false, features = ["std"] }
chio-core-types = { workspace = true }
chio-credit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
chio-spec-validate = { workspace = true }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
