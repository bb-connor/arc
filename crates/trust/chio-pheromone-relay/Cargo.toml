[package]
name = "chio-pheromone-relay"
description = "Live Chio pheromone relay service and durable relay store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_pheromone_relay"

[dependencies]
async-trait = { workspace = true }
axum = "0.8"
chio-core-types = { workspace = true }
chio-egress-contract = { workspace = true, features = ["reqwest-egress"] }
chio-federation = { workspace = true }
chio-http-serve = { workspace = true }
chio-pheromone-runtime = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
chio-pheromone = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
tempfile = { workspace = true }
tokio = { workspace = true }

tracing-subscriber = { workspace = true }

[lints]
workspace = true
