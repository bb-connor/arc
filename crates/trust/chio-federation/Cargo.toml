[package]
name = "chio-federation"
description = "Chio federation quorum, admission, and reputation-clearing contracts"
version.workspace = true
edition.workspace = true
# Kani 0.67 uses Rust 1.93; this formal-proof dependency remains compatible.
rust-version = "1.93"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_federation"

[features]
demo = []
# Enables the dudect timing-leak harness at
# `tests/dudect/bilateral_dsse_verify.rs`. Off by default so
# `cargo test -p chio-federation` stays fast and deterministic; the dudect
# lane opts in via `--features dudect --release --test
# dudect_bilateral_dsse_verify`.
dudect = ["dep:dudect-bencher"]
pq = ["chio-core-types/pq"]
typestate = []

[dependencies]
chio-core-types = { workspace = true }
chio-listing = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-open-market = { workspace = true }
chio-pheromone = { workspace = true }
chio-revocation-oracle = { workspace = true }
frost-ed25519 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# DSSE signature-slice bilateral envelope. The strict treaty-bound bilateral
# invocation schema is deferred until the producer
# receives the missing invocation fields; this slice still serialises the
# canonical-JSON in-toto Statement as Base64 and binds keyid as SHA-256 of
# the passport public key (hex-encoded, via the `hex` crate). base64, sha2,
# and hex are also used by bilateral_verifier.rs and its submodules.
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# `dudect-bencher` is gated behind the `dudect` feature so default builds
# never pull it in. Used only by the timing-leak harness at
# `tests/dudect/bilateral_dsse_verify.rs`.
dudect-bencher = { version = "0.7", optional = true }

[dev-dependencies]
# Integration test crates/trust/chio-federation/tests/oracle_gossip_e2e.rs walks
# a single-host gossip mesh end-to-end and asserts the oracle-insert to
# verifier-visibility latency budget. The kernel-core RevocationView is
# the verifier-side surface so that crate is pulled in here as a dev
# dependency only.
chio-kernel-core = { workspace = true }
# Integration test crates/trust/chio-federation/tests/verifier_hook_conformance.rs
# drives the specification's numbered conforming verifier and the kernel's
# pre-dispatch admission hook over one shared corpus, so it needs the kernel
# hook and the runtime store that backs it. Dev-only, so the published
# dependency graph is unchanged.
chio-kernel = { workspace = true }
chio-runtime-core = { workspace = true }
chio-spec-validate = { workspace = true }
criterion = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }

[[bench]]
name = "bilateral_verify"
harness = false

# Timing-leak dudect harness. `harness = false` so the test binary's `main`
# is provided by `dudect_bencher::ctbench_main!`. Gated behind the `dudect`
# feature so default `cargo test` does not compile it (the source is
# `#![cfg(feature = "dudect")]`).
[[test]]
name = "dudect_bilateral_dsse_verify"
path = "tests/dudect/bilateral_dsse_verify.rs"
harness = false
required-features = ["dudect"]

[lints]
workspace = true
