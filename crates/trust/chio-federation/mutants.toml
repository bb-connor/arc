# Focused cargo-mutants config for chio-federation.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/trust/chio-federation/mutants.toml --package chio-federation
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.
#
# Scope: the treaty admission path. `bilateral_dsse.rs` and
# `bilateral_verifier.rs` are `mod` umbrellas over their module directories,
# so the production child files are listed alongside them. `bilateral.rs` is
# the co-signing producer and holds the rejection-code taxonomy the verifier
# maps failures onto. `treaty.rs` carries the treaty scope, ladder
# intersection, and bilateral invocation validators.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/trust/chio-federation/src/bilateral.rs",
    "crates/trust/chio-federation/src/bilateral_dsse.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/builder.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/policy.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/sign.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/types.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/typestate_handlers.rs",
    "crates/trust/chio-federation/src/bilateral_dsse/verify.rs",
    "crates/trust/chio-federation/src/bilateral_verifier.rs",
    "crates/trust/chio-federation/src/bilateral_verifier/*.rs",
    "crates/trust/chio-federation/src/treaty.rs",
]

exclude_globs = [
    # rationale: tests and benches are verification surfaces, not treaty
    # admission logic.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
    "**/benches/**", # rationale: excluded helper or verification surface.
    # rationale: the typestate producer is generated behind the `typestate`
    # feature and regenerated from its template; the handlers it dispatches
    # to are examined directly.
    "crates/trust/chio-federation/src/_generated/**", # rationale: excluded helper or verification surface.
]
