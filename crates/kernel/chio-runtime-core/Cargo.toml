[package]
name = "chio-runtime-core"
description = "Live Chio runtime admission for kernel-mediated cross-vendor workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_runtime_core"

[dependencies]
chio-security-types = { workspace = true, features = ["std"] }
chio-attest-buyer-core = { workspace = true }
chio-core-types = { workspace = true }
chio-federation = { workspace = true }
chio-kernel = { workspace = true }
chio-runtime-proof-parity = { workspace = true }
chio-sqlite-file-identity = { workspace = true }
chio-swarm-authority = { workspace = true }
chio-workflow = { workspace = true, optional = true }
chio-weights = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
work = ["dep:chio-workflow"]

[dev-dependencies]
chio-kernel = { workspace = true, features = ["admission-test-support"] }
jsonschema = { workspace = true }
chio-test-support = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chio-attest-loopback = { workspace = true }
chio-store-sqlite = { workspace = true }
chrono = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "cross_boundary_admission"
harness = false

[lints]
workspace = true

[[test]]
name = "work_contracts"
required-features = ["work"]
