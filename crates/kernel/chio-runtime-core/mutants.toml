# Focused cargo-mutants config for chio-runtime-core.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/kernel/chio-runtime-core/mutants.toml --package chio-runtime-core
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.
#
# Scope: the treaty admission path inside the runtime hook.
# `admission_hook.rs` reserves, consumes, and releases treaty continuations;
# `admission_hook/dsse.rs` and `admission_hook/treaty_evidence.rs` verify the
# bilateral DSSE envelope and the treaty evidence chain before dispatch;
# `treaty.rs` and `treaty/predicate.rs` hold the treaty validators and the
# bounded predicate evaluator; `store/sqlite/admission_replay.rs` is the
# durable replay fence behind the continuation. The remaining runtime modules
# (buyer review, orchestration, swarm authority, trust floors) are out of scope.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/kernel/chio-runtime-core/src/admission_hook.rs",
    "crates/kernel/chio-runtime-core/src/admission_hook/dsse.rs",
    "crates/kernel/chio-runtime-core/src/admission_hook/treaty_evidence.rs",
    "crates/kernel/chio-runtime-core/src/treaty.rs",
    "crates/kernel/chio-runtime-core/src/treaty/predicate.rs",
    "crates/kernel/chio-runtime-core/src/store/sqlite/admission_replay.rs",
]

exclude_globs = [
    # rationale: tests and benches are verification surfaces, not runtime
    # admission logic.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
    "**/benches/**", # rationale: excluded helper or verification surface.
]
