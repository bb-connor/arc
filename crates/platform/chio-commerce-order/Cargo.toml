[package]
name = "chio-commerce-order"
description = "Chio commerce order passport verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_commerce_order"

[features]
# Enables `chio_commerce_order::fuzz`, the libFuzzer entry point for the
# authority receipt replay and settlement checks. Consumed only by the
# standalone `chio-fuzz` workspace at `../../../fuzz`.
fuzz = []

[dependencies]
chio-core-types = { workspace = true }
chio-credit = { workspace = true }
chio-risk-comptroller = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
chio-test-support = { workspace = true }

[lints]
workspace = true
