[package]
name = "chio-provider-conformance"
description = "Provider replay harness for Chio native adapter conformance fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-anthropic-tools-adapter = { workspace = true, features = ["computer-use"], optional = true }
chio-bedrock-converse-adapter = { workspace = true, optional = true }
chio-cohere-tools-adapter = { workspace = true, optional = true }
chio-gemini-tools-adapter = { workspace = true, optional = true }
chio-groq-tools-adapter = { workspace = true, optional = true }
chio-manifest = { workspace = true, optional = true }
chio-mistral-tools-adapter = { workspace = true, optional = true }
chio-ollama-tools-adapter = { workspace = true, optional = true }
chio-openai = { package = "chio-openai-adapter", path = "../chio-openai-adapter", features = ["provider-adapter"], optional = true }
chio-tool-call-fabric = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "record"
path = "src/bin/record.rs"

[features]
default = []
fixtures-openai = ["dep:chio-openai", "dep:chio-manifest"]
fixtures-anthropic = ["dep:chio-anthropic-tools-adapter", "dep:chio-manifest"]
fixtures-bedrock = ["dep:chio-bedrock-converse-adapter", "dep:chio-manifest"]
fixtures-cohere = ["dep:chio-cohere-tools-adapter", "dep:chio-manifest"]
fixtures-gemini = ["dep:chio-gemini-tools-adapter", "dep:chio-manifest"]
fixtures-groq = ["dep:chio-groq-tools-adapter", "dep:chio-manifest"]
fixtures-mistral = ["dep:chio-mistral-tools-adapter", "dep:chio-manifest"]
fixtures-ollama = ["dep:chio-ollama-tools-adapter", "dep:chio-manifest"]

[lints]
workspace = true
