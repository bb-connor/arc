[package]
name = "chio-a2a-adapter"
description = "Thin A2A-to-Chio adapter for agent-card discovery and SendMessage mediation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_a2a_adapter"

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
chio-core = { version = "=0.2.0-alpha.1", package = "chio-core-types", path = "../../core/chio-core-types" }
chio-egress-contract = { workspace = true, features = ["ureq-egress"] }
chio-kernel = { workspace = true }
chio-security-types = { workspace = true }
chio-manifest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
# `arbitrary` is gated behind the `fuzz` feature so production builds stay
# free of fuzz instrumentation. Pulled in by `fuzz/fuzz_targets/a2a_envelope_decode.rs`
# via `chio-a2a-adapter = { features = ["fuzz"] }`.
arbitrary = { version = "1", features = ["derive"], optional = true }

[features]
# Enables `chio_a2a_adapter::fuzz`, the libFuzzer entry-point module driving
# the per-envelope fan-out trust boundary. Off by default; turned on only by
# the `chio-fuzz` standalone workspace at `../../fuzz`. Production builds of
# `chio-a2a-adapter` never pull in `arbitrary` and never expose `fuzz` symbols.
fuzz = ["dep:arbitrary"]

[dev-dependencies]
rcgen = "0.13"
ureq = "2.10"
tokio = { workspace = true }

[lints]
workspace = true
