[package]
name = "chio-egress-contract"
description = "Typed HTTP egress contract for Chio substrate adapters"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_egress_contract"

[dependencies]
chio-core = { version = "=0.2.0-alpha.1", package = "chio-core-types", path = "../../core/chio-core-types" }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
url = { workspace = true }
http = { version = "1", optional = true }
reqwest = { workspace = true, default-features = false, features = ["form", "json", "query", "rustls"], optional = true }
tokio = { workspace = true, features = ["net"], optional = true }
ureq = { version = "2.10", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
# Opt-in helper that wraps a `reqwest` dispatch with `HttpEgressContract`
# enforcement on the initial URL, on every redirect, and on observed response
# size. Callers that depend on this feature get `send_with_contract`.
reqwest-egress = ["dep:http", "dep:reqwest", "dep:serde_json", "dep:tokio"]
# Blocking ureq helper: `BlockingContractAgent` enforces the contract on the
# request URL, on every resolved address, and on the response size, and never
# follows redirects.
ureq-egress = ["dep:ureq", "dep:webpki-roots"]

[[test]]
name = "ureq_proxy_env"
required-features = ["ureq-egress"]

[dev-dependencies]
rcgen = "0.13"
serde_json = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls", "http2"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
