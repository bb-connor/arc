name: admin-override-audit

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged pull request whose qualification is audited
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  audit:
    name: admin-override-audit
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      SECURITY_APP_ID: ${{ vars.CHIO_SECURITY_APP_ID }}
      SECURITY_DEFINITION_SHA: ${{ vars.CHIO_ENTERPRISE_SECURITY_DEFINITION_SHA }}
      AUDIT_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout authorized auditor without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ vars.CHIO_ENTERPRISE_SECURITY_DEFINITION_SHA }}
          path: authorized-auditor
          fetch-depth: 1
          persist-credentials: false

      - name: Audit recorded qualification and protected merge
        shell: bash
        run: |
          set -euo pipefail
          audit_rc=0
          python3 -I authorized-auditor/scripts/audit-security-merge-qualification.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            --security-app-id "${SECURITY_APP_ID}" \
            --definition-sha "${SECURITY_DEFINITION_SHA}" \
            --audit-workflow-sha "${AUDIT_WORKFLOW_SHA}" \
            --output audit.json \
            --markdown audit.md || audit_rc=$?
          cat audit.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${audit_rc}"
