name: JVM SDK

# Build the JVM SDK and qualify Kotlin's native mobile ABI when either the
# consumers or their complete local Rust dependency closure changes.

on:
  push:
    branches: [main]
    paths:
      - "sdks/jvm/**"
      - "crates/**"
      - "third_party/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/bindings/kotlin-mobile/**"
      - "scripts/check-kotlin-mobile.sh"
      - "scripts/build-android-aar.sh"
      - ".github/workflows/jvm.yml"
  pull_request:
    paths:
      - "sdks/jvm/**"
      - "crates/**"
      - "third_party/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tests/bindings/kotlin-mobile/**"
      - "scripts/check-kotlin-mobile.sh"
      - "scripts/build-android-aar.sh"
      - ".github/workflows/jvm.yml"

permissions:
  contents: read

concurrency:
  group: jvm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin-native-contract:
    name: Kotlin mobile native ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Compile the actual wrapper and execute Rust through generated Kotlin
        run: bash scripts/check-kotlin-mobile.sh

  jvm-build:
    name: JVM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Check JVM formatting
        working-directory: sdks/jvm
        run: ./gradlew spotlessCheck --no-daemon
      - name: Build JVM modules
        working-directory: sdks/jvm
        run: ./gradlew build --no-daemon
