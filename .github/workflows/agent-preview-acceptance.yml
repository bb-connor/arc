name: Agent preview acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/agent-preview-acceptance.yml"
      - "scripts/install-chio.sh"
      - "scripts/check-agent-install.sh"
      - "scripts/package-agent-preview.py"
      - "scripts/agent-preview-readme.md"
      - "scripts/check-agent-preview-runtime.py"
      - "scripts/tests/agent-preview-runtime.test.py"
      - "examples/mcp-adoption/**"
      - "examples/langchain-kernel/**"
      - "sdks/python/chio-py/**"
      - "sdks/python/chio-sdk-python/**"
      - "sdks/python/chio-adapter-base/**"
      - "sdks/python/chio-langchain/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-preview-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview installation (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CARGO_BUILD_JOBS: "2"
      CHIO_INSTALL_PYTHON: python3.11
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build prerequisites
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler cmake pkg-config libssl-dev
      - name: Install repository Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "0.11.21"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: agent-preview-${{ matrix.arch }}
      - name: Check archive intake
        run: python3 scripts/tests/agent-preview-runtime.test.py
      - name: Build and test the installed CLI and wheels
        run: scripts/check-agent-install.sh --debug --output "$RUNNER_TEMP/chio-install"
      - name: Package the tested artifacts
        run: |
          python3 scripts/package-agent-preview.py \
            --installation "$RUNNER_TEMP/chio-install" \
            --output "$RUNNER_TEMP/chio-agent-preview.tar.gz" \
            > "$RUNNER_TEMP/chio-agent-preview.json"
      - name: Test the archive in a clean runtime container
        run: |
          archive_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/chio-agent-preview.json"))["sha256"])')"
          python3 scripts/check-agent-preview-runtime.py \
            --archive "$RUNNER_TEMP/chio-agent-preview.tar.gz" \
            --sha256 "$archive_sha" \
            --output "$RUNNER_TEMP/chio-runtime"
      - name: Retain the preview and public acceptance records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chio-agent-preview-linux-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chio-agent-preview.tar.gz
            ${{ runner.temp }}/chio-agent-preview.json
            ${{ runner.temp }}/chio-runtime/acceptance.json
