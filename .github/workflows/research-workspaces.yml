name: Research workspace qualification

on:
  pull_request:
    paths:
      - 'examples/composed-baseline/**'
      - 'examples/funded-work-model/**'
      - 'labs/kernel-work-composition/**'
      - 'labs/kernel-work-families/**'
      - 'docs/research/kernel-work/fixtures.json'
      - 'crates/**'
      - 'third_party/**'
      - 'supply-chain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/*research-workspaces*'
      - 'scripts/research_workspaces.py'
      - 'scripts/tests/check-research-workspaces.test.py'
      - '.github/workflows/research-workspaces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Research / ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - examples/composed-baseline
          - labs/kernel-work-composition
          - labs/kernel-work-families
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/research-ci
      RESEARCH_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup show active-toolchain
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: research-${{ matrix.workspace }}
      - name: Verify locked source policy
        run: |
          python3 scripts/tests/check-research-workspaces.test.py
          python3 scripts/check-research-workspaces.py --workspace "$RESEARCH_WORKSPACE"
      - name: Build and lint
        run: |
          cargo fmt --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" -- --check
          cargo build --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets
          cargo clippy --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets

  funded-work-model:
    name: Research / examples/funded-work-model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test the funded work model
        run: python3 -B -m unittest discover -s examples/funded-work-model -p 'test_*.py' -v
