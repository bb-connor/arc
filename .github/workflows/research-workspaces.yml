name: Research workspace qualification

on:
  pull_request:
    paths:
      - 'examples/federated-work/**'
      - 'examples/composed-baseline/**'
      - 'examples/outcome-ledger-comparison/**'
      - 'labs/kernel-work-composition/**'
      - 'labs/kernel-work-families/**'
      - 'crates/**'
      - 'third_party/**'
      - 'supply-chain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/*research-workspaces*'
      - 'scripts/research_workspaces.py'
      - 'scripts/tests/check-research-workspaces.test.py'
      - 'scripts/outcome-ledger-profile.py'
      - 'scripts/tests/outcome-ledger-profile.test.py'
      - '.github/workflows/research-workspaces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Research / ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - examples/federated-work
          - examples/composed-baseline
          - examples/outcome-ledger-comparison
          - labs/kernel-work-composition
          - labs/kernel-work-families
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/research-ci
      CHIO_CHECKOUT_ROOT: ${{ github.workspace }}
      RESEARCH_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup show active-toolchain
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler
      - name: Install outcome-ledger namespace prerequisites
        if: matrix.workspace == 'examples/outcome-ledger-comparison'
        uses: ./.github/actions/apt-install
        with:
          packages: apparmor-profiles apparmor-utils bubblewrap python3.12 python3-cryptography git dash util-linux
      - name: Qualify the outcome-ledger namespace fixture
        if: matrix.workspace == 'examples/outcome-ledger-comparison'
        run: |
          set -euo pipefail
          # Use the same package-provided profile as release qualification.
          bwrap_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$bwrap_profile"
          sudo install -m 0644 "$bwrap_profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          /usr/bin/python3.12 -I -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM'
          /usr/bin/bwrap --unshare-user --unshare-net --disable-userns --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: research-${{ matrix.workspace }}
      - name: Verify locked source policy
        run: |
          python3 scripts/tests/check-research-workspaces.test.py
          python3 scripts/check-research-workspaces.py --workspace "$RESEARCH_WORKSPACE"
      - name: Build and lint retained evidence workspaces
        run: |
          cargo fmt --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" -- --check
          cargo build --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets
          cargo clippy --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets -- -D warnings
      - name: Qualify the nested outcome-ledger auditor profile
        if: matrix.workspace == 'examples/outcome-ledger-comparison'
        run: |
          set -euo pipefail
          python3 scripts/tests/outcome-ledger-profile.test.py
          python3 scripts/outcome-ledger-profile.py \
            --controller "$CARGO_TARGET_DIR/debug/chio-outcome-ledger-comparison" \
            --output "$RUNNER_TEMP/chio-outcome-ledger.profile"
          sudo apparmor_parser -r -K "$RUNNER_TEMP/chio-outcome-ledger.profile"
      - name: Test retained evidence workspaces
        run: |
          cargo test --locked --manifest-path "$RESEARCH_WORKSPACE/Cargo.toml" --all-targets
      - name: Retire the outcome-ledger auditor profile
        if: always() && matrix.workspace == 'examples/outcome-ledger-comparison'
        run: |
          if test -f "$RUNNER_TEMP/chio-outcome-ledger.profile"; then
            sudo apparmor_parser -R -K "$RUNNER_TEMP/chio-outcome-ledger.profile"
          fi
      - name: Test the Python participant and isolation probe
        if: matrix.workspace == 'examples/federated-work'
        run: |
          python3 -m venv "$RUNNER_TEMP/research-python"
          "$RUNNER_TEMP/research-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r examples/federated-work/python_buyer/requirements.txt
          "$RUNNER_TEMP/research-python/bin/python" -B -m unittest discover -s examples/federated-work/python_buyer -p 'test_*.py'
