name: Security nextest advisory
run-name: Security nextest advisory E=${{ github.event.pull_request.head.sha || github.sha }}

# Failures remain visible in this separate advisory run and its JUnit artifact.
# Only CI is an input to security authority publication and revocation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "256"
  CHIO_CI_RUSTFLAGS: "-D warnings -C link-arg=-Wl,--threads=1"

jobs:
  nextest-security:
    name: nextest (security crates, one process per test)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Additive: the workspace lanes still run every test under `cargo test`.
    # This lane runs the security crates under cargo-nextest, so each test
    # gets its own process, a per-test deadline and leak detection
    # (.config/nextest.toml). A test that passes under `cargo test` and fails
    # here is a lead, not yet a finding: it may depend on state a sibling left
    # in the shared process, on environment or stdio the harness inherited
    # differently, or on the harness's own timing, and each case is
    # dispositioned individually before anything is called a defect. Doctests
    # are not nextest's to run and stay with the `cargo test` lanes.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-nextest
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-nextest-tool-target
        run: |
          cargo install cargo-nextest --locked --version 0.9.146
          cargo nextest --version

      - name: Security crates under nextest
        env:
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          cargo nextest run --profile ci --locked \
            -p chio-cage -p chio-security-types -p chio-response-model -p chio-flow -p chio-decoy \
            -p chio-quarantine -p chio-keyring -p chio-security-kernel \
            -p chio-active-response-authority -p chio-secure-ipc -p chio-secret-broker

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextest-security-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 30

