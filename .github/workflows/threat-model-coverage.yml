# threat-model-coverage.yml - threat-coverage CI gate.
#
# Two complementary gates run in this workflow:
#
#   1. `scripts/check-threat-coverage.sh` (file-existence gate):
#      fails the build if any threat ID lacks a populated test
#      body (the codegen stub at
#      crates/tooling/chio-conformance/tests/threats/<id>.rs still calls
#      `unimplemented!()`) and is not explicitly marked
#      `coverage_state: pending` (with a `deferred_to`),
#      `coverage_state: partial`, or `coverage_state:
#      weak_coverage` in the threat-model JSON.
#
#   2. `scripts/check-threat-coverage-mutants.sh` (per-row mutation-
#      testing gate): for each
#      `covered` row, asserts the existence of an evidence file at
#      `audits/evidence/threats/<id>.json` recording at least one
#      caught mutant. Missing evidence, zero-kill evidence, and
#      bootstrap placeholders (`needs_real_run: true`) fail this
#      release gate. The non-release diagnostic mode may emit weak
#      coverage hints, but this workflow never selects that mode.
#
# Pending vectors auto-promoted by the fuzz-seed promoter live in
# the corpus, not the threat list, and are excluded from this gate
# by construction.
#
# Standalone check name: threat-model-coverage / coverage-gate. Pull requests
# and pushes are enforced transitively through CI's required Security contract.

name: threat-model-coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

concurrency:
  group: threat-model-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python (json parser)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run threat-model coverage gate (file-existence)
        run: bash scripts/check-threat-coverage.sh

      - name: Run threat-model mutants gate (per-row evidence)
        run: bash scripts/check-threat-coverage-mutants.sh

      - name: Self-test the coverage gate (state matrix)
        run: bash scripts/tests/check-threat-coverage.test.sh

      - name: Self-test the mutants gate (evidence matrix)
        run: bash scripts/tests/check-threat-coverage-mutants.test.sh

      - name: Cargo test - threat_model_schema_test
        run: cargo test -p chio-spec-codegen --test threat_model_schema_test

      - name: Cargo test - threat-model integration test
        run: cargo test -p chio-conformance --test threats
