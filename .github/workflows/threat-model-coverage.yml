# threat-model-coverage.yml - threat-coverage CI gate.
#
# Two complementary gates run in this workflow:
#
#   1. `scripts/check-threat-coverage.sh` (file-existence gate):
#      fails if a covered or partial threat ID lacks the required test
#      body, if partial evidence is invalid, or if a pending row lacks a
#      technical `deferred_to` closure condition.
#
#   2. `scripts/check-threat-coverage-mutants.sh` (per-row mutation-
#      testing gate): for each `covered` or `partial` row, asserts the
#      existence of a source-bound evidence file at
#      `audits/evidence/threats/<id>.json` recording at least one
#      caught mutant and zero survivors. Pending rows are accepted only by
#      their explicit threat-model state and technical closure condition.
#
# Standalone check name: threat-model-coverage / coverage-gate. Pull requests
# and pushes are enforced transitively through CI's required Security contract.

name: threat-model-coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

concurrency:
  group: threat-model-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python (json parser)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run threat-model coverage gate (file-existence)
        run: bash scripts/check-threat-coverage.sh

      - name: Install and authenticate cargo-mutants
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-mutants --locked --version 25.3.1
          cargo_mutants="$(command -v cargo-mutants)"
          test -n "${cargo_mutants}"
          test "$(realpath "${cargo_mutants}")" = "${cargo_mutants}"
          test -f "${cargo_mutants}"
          test ! -L "${cargo_mutants}"
          test -x "${cargo_mutants}"
          test "$(stat -c '%h' "${cargo_mutants}")" = "1"
          test "$("${cargo_mutants}" mutants --version)" = "cargo-mutants 25.3.1"

      - name: Run threat-model mutants gate (per-row evidence)
        run: bash scripts/check-threat-coverage-mutants.sh

      - name: Self-test the coverage gate (state matrix)
        run: bash scripts/tests/check-threat-coverage.test.sh

      - name: Self-test the mutants gate (evidence matrix)
        run: bash scripts/tests/check-threat-coverage-mutants.test.sh

      - name: Cargo test - threat_model_schema_test
        run: cargo test -p chio-spec-codegen --test threat_model_schema_test

      - name: Cargo test - threat-model integration test
        run: cargo test -p chio-conformance --test threats
