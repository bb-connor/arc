name: Lane test
run-name: lane-test ${{ inputs.item }} ${{ inputs.nonce }}

# Dispatched by the swarm CLI (`swarm ci`) on `main`; it checks out the lane
# ref itself because lane branches do not carry this workflow file.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Full 40-character commit SHA to test (the swarm CLI resolves branches)
        required: true
        type: string
      item:
        description: Swarm item ID
        required: true
        type: string
      packages:
        description: Space-separated cargo packages
        required: true
        type: string
      filter:
        description: Optional test name filter
        required: false
        default: ""
        type: string
      features:
        description: Optional comma-separated cargo features
        required: false
        default: ""
        type: string
      nonce:
        description: Correlation token from the swarm CLI
        required: true
        type: string

concurrency:
  group: lane-test-${{ inputs.item }}
  cancel-in-progress: true

permissions:
  contents: read

# Lanes run on main's cache scope but execute lane code: restore only, never save.
cache-mode: read

env:
  CARGO_TERM_COLOR: always
  CHIO_CI_RUSTFLAGS: "-D warnings -C link-arg=-Wl,--threads=1"

jobs:
  test:
    name: Lane test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate inputs
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          ITEM: ${{ inputs.item }}
          PACKAGES: ${{ inputs.packages }}
          FILTER: ${{ inputs.filter }}
          FEATURES: ${{ inputs.features }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          # An immutable commit, so a green result cannot attach to code pushed after the run.
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "target_ref must be a full commit SHA"; exit 1; }
          [[ "$ITEM" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "bad item"; exit 1; }
          [[ "$PACKAGES" =~ ^[A-Za-z0-9_\ -]+$ ]] || { echo "bad packages"; exit 1; }
          # A leading '-' would reach libtest as an option (for example --include-ignored), not a name filter.
          [[ "$FILTER" =~ ^([A-Za-z0-9_:.][A-Za-z0-9_:.\ -]*)?$ ]] || { echo "bad filter"; exit 1; }
          [[ "$FEATURES" =~ ^[A-Za-z0-9_,/\ -]*$ ]] || { echo "bad features"; exit 1; }
          # The nonce becomes part of the artifact name, so keep it to artifact-safe characters.
          [[ "$NONCE" =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "bad nonce"; exit 1; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal
          # chio-wasm-guards tests compile example guards to WASM (AGENTS.md toolchain prerequisites).
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain

      - name: Install protobuf compiler
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for attempt in 1 2 3; do
            if timeout 180s sudo apt-get update && timeout 180s sudo apt-get install -y protobuf-compiler; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # Same contract dependencies as ci.yml: chio-settle devnet and web3 tests
      # otherwise skip silently and count as passed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install web3 contract dependencies
        run: pnpm --dir contracts install --frozen-lockfile

      # Same pinned Bun as ci.yml's workspace tests (chio-formal-diff-tests requires it).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      # Restore-only: this job runs on main's cache scope but executes lane code,
      # so it reads the cache ci.yml's check job saves on main and never writes one.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: check
          save-if: "false"

      - name: Test
        env:
          PACKAGES: ${{ inputs.packages }}
          FILTER: ${{ inputs.filter }}
          FEATURES: ${{ inputs.features }}
          # Host-scoped, not RUSTFLAGS: the linker flag would otherwise reach nested
          # wasm32 builds (chio-wasm-guards fixtures), where rust-lld rejects it.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          if [ -n "$FEATURES" ]; then args+=(--features "$FEATURES"); fi
          filter=()
          if [ -n "$FILTER" ]; then filter+=("$FILTER"); fi
          cargo test --locked "${args[@]}" -- "${filter[@]}" 2>&1 | tee lane-test.log
          # libtest exits 0 when a filter matches nothing; a lane that executed no test is not a pass.
          executed=$(awk '/^test result:/ { for (i = 2; i <= NF; i++) if ($i ~ /^(passed|failed);$/) n += $(i - 1) } END { print n + 0 }' lane-test.log)
          echo "executed tests: $executed"
          if [ "$executed" -eq 0 ]; then
            echo "::error::no test executed for packages '$PACKAGES' with filter '$FILTER'"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lane-test-${{ inputs.item }}-${{ inputs.nonce }}
          path: lane-test.log
          if-no-files-found: ignore
