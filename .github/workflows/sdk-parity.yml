name: SDK Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/products/chio-api-protect/**"
      - "crates/products/chio-cli/**"
      - "crates/protocol/chio-mcp-edge/**"
      - "crates/platform/chio-control-plane/**"
      - "examples/langchain-kernel/**"
      - "examples/mcp-adoption/**"
      - "scripts/check-langchain-kernel.sh"
      - "crates/core/chio-core-types/**"
      - "crates/core/chio-core/**"
      - "crates/protocol/chio-mcp-adapter/**"
      - "crates/platform/chio-http-core/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/tooling/chio-conformance/**"
      - "sdks/**"
      - "scripts/check-sdk-parity.sh"
      - "scripts/check-bindings-parity.sh"
      - "scripts/check-chio-py.sh"
      - "scripts/check-chio-go.sh"
      - "scripts/check-chio-cpp.sh"
      - "scripts/check-chio-drogon.sh"
      - "tests/bindings/**"
      - ".github/workflows/sdk-parity.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/products/chio-api-protect/**"
      - "crates/products/chio-cli/**"
      - "crates/protocol/chio-mcp-edge/**"
      - "crates/platform/chio-control-plane/**"
      - "examples/langchain-kernel/**"
      - "examples/mcp-adoption/**"
      - "scripts/check-langchain-kernel.sh"
      - "crates/core/chio-core-types/**"
      - "crates/core/chio-core/**"
      - "crates/protocol/chio-mcp-adapter/**"
      - "crates/platform/chio-http-core/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/tooling/chio-conformance/**"
      - "sdks/**"
      - "scripts/check-sdk-parity.sh"
      - "scripts/check-bindings-parity.sh"
      - "scripts/check-chio-py.sh"
      - "scripts/check-chio-go.sh"
      - "scripts/check-chio-cpp.sh"
      - "scripts/check-chio-drogon.sh"
      - "tests/bindings/**"
      - ".github/workflows/sdk-parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-sdk-parity', github.ref) || format('main-{0}-sdk-parity', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  sdk-parity:
    name: SDK parity contract lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install parity dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler cmake build-essential libcurl4-openssl-dev

      - name: Run SDK parity
        run: ./scripts/check-sdk-parity.sh

  langchain-kernel:
    name: LangChain kernel execution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler cmake build-essential
      - name: Test Python receipt and LangChain behavior
        run: uv run --locked --project sdks/python/chio-langchain --extra dev python -m pytest sdks/python/chio-py/tests sdks/python/chio-langchain/tests --import-mode=importlib
      - name: Execute real tools through the Rust kernel
        run: ./scripts/check-langchain-kernel.sh
      - name: Check LangChain 1.x compatibility
        run: |
          uv run --locked --project sdks/python/chio-langchain --extra dev --with 'langchain-core>=1,<2' python -m pytest sdks/python/chio-langchain/tests
          uv run --locked --project sdks/python/chio-langchain --extra mcp --with 'langchain-core>=1,<2' python examples/langchain-kernel/run.py --chio "$PWD/target/debug/chio"
      - name: Verify imported MCP configuration and persistent history
        run: uv run --locked --project sdks/python/chio-py --extra mcp python examples/mcp-adoption/check.py --chio "$PWD/target/debug/chio"
