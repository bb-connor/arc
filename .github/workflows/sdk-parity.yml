name: SDK Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/products/chio-api-protect/**"
      - "crates/core/chio-core-types/**"
      - "crates/platform/chio-http-core/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/tooling/chio-conformance/**"
      - "sdks/**"
      - "scripts/check-sdk-parity.sh"
      - "scripts/check-bindings-parity.sh"
      - "scripts/check-chio-py.sh"
      - "scripts/check-chio-go.sh"
      - "scripts/check-chio-cpp.sh"
      - "scripts/check-chio-drogon.sh"
      - "scripts/run-exact-cargo-test-inventory.sh"
      - "scripts/check-exact-cargo-test-inventory.py"
      - "tests/bindings/**"
      - ".github/workflows/sdk-parity.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/products/chio-api-protect/**"
      - "crates/core/chio-core-types/**"
      - "crates/platform/chio-http-core/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/tooling/chio-conformance/**"
      - "sdks/**"
      - "scripts/check-sdk-parity.sh"
      - "scripts/check-bindings-parity.sh"
      - "scripts/check-chio-py.sh"
      - "scripts/check-chio-go.sh"
      - "scripts/check-chio-cpp.sh"
      - "scripts/check-chio-drogon.sh"
      - "scripts/run-exact-cargo-test-inventory.sh"
      - "scripts/check-exact-cargo-test-inventory.py"
      - "tests/bindings/**"
      - ".github/workflows/sdk-parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-sdk-parity', github.ref) || format('main-{0}-sdk-parity', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  sidecar-control-authority:
    name: Exact sidecar control authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler cmake build-essential

      - name: Exact control credential regressions
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Sidecar control authority" --allow-filtered --expected \
            proxy::tests::control_auth::unconfigured_control_denies_ipv4_loopback_on_every_route \
            proxy::tests::control_auth::unconfigured_control_denies_ipv6_loopback_on_every_route \
            proxy::tests::control_auth::unconfigured_control_denies_unknown_and_remote_peers \
            proxy::tests::control_auth::blank_control_configuration_denies_even_loopback \
            proxy::tests::control_auth::configured_control_denies_missing_and_wrong_credentials \
            proxy::tests::control_auth::duplicate_authorization_headers_are_rejected_in_either_order \
            proxy::tests::control_auth::malformed_authorization_is_rejected_on_every_route \
            proxy::tests::control_auth::forwarded_localhost_headers_do_not_authenticate_control_requests \
            proxy::tests::control_auth::unauthenticated_loopback_cannot_sign_or_resolve_operator_approval \
            proxy::tests::control_auth::unauthenticated_loopback_cannot_revoke_capabilities \
            proxy::tests::control_auth::authenticated_control_works_without_peer_metadata \
            proxy::tests::control_auth::public_liveness_is_available_without_control_credentials \
            -- cargo test --locked -p chio-api-protect --lib proxy::tests::control_auth

  sdk-parity:
    name: SDK parity contract lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install parity dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler cmake build-essential libcurl4-openssl-dev

      - name: Run SDK parity
        run: ./scripts/check-sdk-parity.sh
