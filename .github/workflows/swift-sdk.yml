name: Swift SDK

on:
  push:
    paths:
      - ".github/workflows/swift-sdk.yml"
      - "sdks/swift/**"
      - "scripts/build-ios-framework.sh"
      - "scripts/test-swift-sdk.sh"
      - "crates/**"
      - "third_party/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/swift-sdk.yml"
      - "sdks/swift/**"
      - "scripts/build-ios-framework.sh"
      - "scripts/test-swift-sdk.sh"
      - "crates/**"
      - "third_party/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: swift-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xcodebuild-test:
    name: Swift SDK (iOS Simulator xcodebuild test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          lfs: true

      - name: Test the committed SDK and require executed native calls
        run: bash scripts/test-swift-sdk.sh

  rebuild-framework:
    name: Rebuild and test locked iOS framework
    # Produce one source-bound artifact from the pushed commit. The PR job
    # independently tests the committed package at its merge candidate.
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          lfs: true
      - name: Install pinned Rust and Apple targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ". -> target/mobile-ios"
      - name: Rebuild framework and generated Swift together
        run: bash scripts/build-ios-framework.sh --install
      - name: Test the rebuilt SDK and require executed native calls
        run: bash scripts/test-swift-sdk.sh
      - name: Retain the tested framework and source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chio-ios-framework-${{ github.sha }}
          path: target/release-qualification/mobile-kernel/ios
          if-no-files-found: error
