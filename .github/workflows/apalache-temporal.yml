name: apalache-temporal

# Scheduled/manual liveness checks. Propagation uses an explicit finite
# epoch-order quotient; the original 4-authority/8-capability SMT timeout
# remains unverified. Inductive progress obligations supplement the quotient.
# Full-model safety stays in apalache-safety.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ format('{0}-{1}-apalache-temporal', github.event_name, github.sha) }}

jobs:
  revocation_eventually_seen:
    name: revocation-eventually-seen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: Check source-pinned inductive progress obligations
        run: |
          python3 -m venv "${RUNNER_TEMP}/revocation-progress"
          "${RUNNER_TEMP}/revocation-progress/bin/pip" install z3-solver==4.13.3.0
          "${RUNNER_TEMP}/revocation-progress/bin/python" scripts/tests/check-revocation-progress.test.py
          "${RUNNER_TEMP}/revocation-progress/bin/python" scripts/check-revocation-progress.py \
            --output output/revocation-propagation/progress

      - name: RevocationEventuallySeen finite reduction and witnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-revocation-propagation.py \
            --jar "${HOME}/.local/share/apalache/apalache-0.50.1/lib/apalache.jar" \
            --output output/revocation-propagation

      - name: Upload propagation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: revocation-propagation
          path: output/revocation-propagation
          if-no-files-found: error

  distributed_revocation_temporal:
    name: distributed-revocation-temporal
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: Distributed revocation temporal check
        shell: bash
        run: ./scripts/check-distributed-revocation-temporal.sh

  temporal_verdict:
    name: formal-tla-liveness
    if: ${{ always() }}
    needs:
      - revocation_eventually_seen
      - distributed_revocation_temporal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate temporal results
        env:
          PROPAGATION_RESULT: ${{ needs.revocation_eventually_seen.result }}
          DISTRIBUTED_RESULT: ${{ needs.distributed_revocation_temporal.result }}
        run: |
          set -euo pipefail
          if [[ "${PROPAGATION_RESULT}" != "success" || "${DISTRIBUTED_RESULT}" != "success" ]]; then
            echo "one or more temporal verification jobs did not succeed" >&2
            exit 1
          fi

      - name: Record temporal lane posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: |
          set -euo pipefail
          bash scripts/lane-gate.sh apalache-temporal
          exit "${LANE_EXIT}"
