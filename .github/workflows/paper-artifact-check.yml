name: Paper Artifact Check

on:
  pull_request:
    paths:
      - "docs/papers/programmable-sovereignty/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-kernel/benches/**"
      - "formal/lean4/**"
      - "formal/diff-tests/**"
      - "scripts/generate-programmable-sovereignty-artifact.py"
      - "scripts/tests/programmable-sovereignty-artifact.test.py"
      - "scripts/check-programmable-sovereignty-artifact.sh"
      - ".github/workflows/paper-artifact-check.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/papers/programmable-sovereignty/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-kernel/benches/**"
      - "formal/lean4/**"
      - "formal/diff-tests/**"
      - "scripts/generate-programmable-sovereignty-artifact.py"
      - "scripts/tests/programmable-sovereignty-artifact.test.py"
      - "scripts/check-programmable-sovereignty-artifact.sh"
      - ".github/workflows/paper-artifact-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-artifact-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Historical validation needs exact source, producer, and artifact
          # assembly objects. It never substitutes the current checkout's HEAD.
          fetch-depth: 0
      - name: Install pdftotext
        uses: ./.github/actions/apt-install
        with:
          packages: poppler-utils
      - name: Test historical artifact validation and tamper rejection
        run: python3 scripts/tests/programmable-sovereignty-artifact.test.py
      - name: Validate the retained programmable-sovereignty artifact
        # This checks the archived experiment, not current-source benchmarks.
        # See docs/papers/programmable-sovereignty/HISTORICAL_VALIDATION.md.
        run: python3 scripts/generate-programmable-sovereignty-artifact.py --check-historical
