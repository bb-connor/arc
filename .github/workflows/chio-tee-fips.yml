name: chio-tee-fips

on:
  pull_request:
    paths:
      - .github/workflows/chio-tee-fips.yml
      - crates/trust/chio-tee/**
      - crates/trust/chio-tee-frame/**
      - crates/core/chio-core-types/**
      - crates/core/chio-core/**
      - crates/kernel/chio-kernel/**
      - crates/kernel/chio-kernel-core/**
      - crates/platform/chio-store-sqlite/**
      - crates/products/chio-cli/**
      - spec/schemas/chio-wire/v1/**
      - tests/bindings/fixtures/protocol-primitives-v1.json
      - scripts/check-exact-cargo-test-inventory.py
      - scripts/run-exact-cargo-test-inventory.sh
      - Cargo.toml
      - Cargo.lock
  push:
    branches:
      - main
      - 'project/**'
    paths:
      - .github/workflows/chio-tee-fips.yml
      - crates/trust/chio-tee/**
      - crates/trust/chio-tee-frame/**
      - crates/core/chio-core-types/**
      - crates/core/chio-core/**
      - crates/kernel/chio-kernel/**
      - crates/kernel/chio-kernel-core/**
      - crates/platform/chio-store-sqlite/**
      - crates/products/chio-cli/**
      - spec/schemas/chio-wire/v1/**
      - tests/bindings/fixtures/protocol-primitives-v1.json
      - scripts/check-exact-cargo-test-inventory.py
      - scripts/run-exact-cargo-test-inventory.sh
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

concurrency:
  group: chio-tee-fips-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  threshold-crypto-floor:
    name: Threshold approval crypto floor
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: cmake perl pkg-config protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Exact threshold crypto-floor regressions
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          threshold_list_output="$(mktemp)"
          threshold_run_output="$(mktemp)"
          trap 'rm -f "${threshold_list_output}" "${threshold_run_output}"' EXIT
          cargo test --locked -p chio-kernel --features pq --lib threshold_crypto_floor \
            -- --list 2>&1 | tee "${threshold_list_output}"
          cargo test --locked -p chio-kernel --features pq --lib threshold_crypto_floor \
            -- --test-threads=1 2>&1 | tee "${threshold_run_output}"
          python3 scripts/check-exact-cargo-test-inventory.py \
            --label "Threshold crypto floor" --allow-filtered \
            --list-output "${threshold_list_output}" \
            --run-output "${threshold_run_output}" \
            kernel::tests::threshold_crypto_floor::classical_threshold_verifiers_agree_on_canonical_replay_identity \
            kernel::tests::threshold_crypto_floor::tool_threshold_verifier_enforces_pq_floor_independently \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_proposal_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_proposal_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_vote_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::pq_capability_cannot_authorize_classical_threshold_votes \
            kernel::tests::threshold_crypto_floor::shared_threshold_verifier_rejects_classical_proposal_with_hybrid_votes \
            kernel::tests::threshold_crypto_floor::tool_threshold_verifier_rejects_classical_proposal_with_hybrid_votes \
            kernel::tests::threshold_crypto_floor::all_hybrid_threshold_artifacts_preserve_replay_identity_under_pq_floor \
            kernel::tests::threshold_crypto_floor::algorithm_allowlist_matches_floor_semantics \
            kernel::tests::threshold_crypto_floor::tool_threshold_resolves_current_route_exactly_once \
            kernel::tests::threshold_crypto_floor::shared_threshold_resolves_current_route_exactly_once \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_empty_and_oversized_sets_before_policy_lookup \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_oversized_set_before_policy_lookup \
            kernel::tests::threshold_crypto_floor::threshold_verifiers_enforce_replay_member_id_bounds \
            kernel::tests::threshold_crypto_floor::classical_envelopes_allow_omitted_ed25519_metadata \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_vote_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::empty_algorithm_allowlist_denies \
            kernel::tests::threshold_crypto_floor::hybrid_envelopes_require_explicit_consistent_metadata \
            kernel::tests::threshold_crypto_floor::allow_classical_rejects_hybrid_threshold_artifacts

      - name: Exact boot-gated threshold issuance
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Boot-gated threshold issuance" --allow-filtered --expected \
            kernel::tests::threshold_issuance::classical_boot_preserves_canonical_proposal \
            kernel::tests::threshold_issuance::hybrid_signing_config_debug_omits_seed \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_refreshes_stale_admission_time \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_rechecks_expiry_after_policy_lookup \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_does_not_trust_future_artifact_time \
            kernel::tests::threshold_issuance::installed_hybrid_backend_signs_cumulative_proposal \
            kernel::tests::threshold_issuance::pq_required_proposal_uses_the_boot_verified_authority \
            kernel::tests::threshold_issuance::classical_installed_proposal_dispatches_and_replays_once \
            kernel::tests::threshold_issuance::hybrid_proposal_dispatches_and_replays_once \
            kernel::tests::threshold_issuance::returned_backend_drop_keeps_installed_authority \
            kernel::tests::threshold_issuance::failed_boot_reconfiguration_preserves_previous_authority_and_floor \
            kernel::tests::threshold_issuance::missing_seed_preserves_previous_authority_and_floor \
            kernel::tests::threshold_issuance::incompatible_installed_signer_denies_without_publishing_proposal \
            kernel::tests::threshold_issuance::pending_retry_rechecks_crypto_floor_without_reissuing_proposal \
            kernel::tests::threshold_issuance::pending_retry_rechecks_current_directory \
            kernel::tests::threshold_issuance::reconstructed_kernel_preserves_pending_hybrid_artifact_and_dispatch_identity \
            kernel::tests::threshold_issuance::reconstructed_kernel_without_signer_refuses_retained_hybrid_proposal \
            kernel::tests::threshold_issuance::rotated_authority_does_not_resign_retained_proposal \
            kernel::tests::threshold_issuance::pq_capability_without_boot_signer_cannot_publish_classical_proposal \
            kernel::tests::threshold_issuance::retained_request::cumulative_admission_retains_the_original_request_and_capability \
            kernel::tests::threshold_issuance::retained_request::rejected_capability_does_not_retain_original_request_material \
            kernel::tests::threshold_issuance::retained_request::cumulative_retry_cannot_backfill_missing_original_authority \
            kernel::tests::threshold_issuance::session_continuation::approved_session_retry_resumes_original_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::altered_session_operation_cannot_consume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::replacement_signed_proposal_cannot_take_over_session_wait \
            kernel::tests::threshold_issuance::session_continuation::missing_proposal_cannot_restart_pending_session_request \
            kernel::tests::threshold_issuance::session_continuation::changed_session_lineage_cannot_consume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::rotated_session_authentication_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::cancelled_session_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::draining_session_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_revoked_capability \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_current_threshold_policy \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_approval_votes \
            kernel::tests::threshold_issuance::session_continuation::nested_sync_session_resumes_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::nested_async_session_resumes_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::threshold_session_rejects_unsupported_durable_nonce_profile \
            kernel::tests::threshold_issuance::session_continuation::concurrent_threshold_retry_cannot_claim_same_session_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::normalized_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_sync_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_async_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::failure_observation_preserves_pending_operation_and_approval_authority \
            kernel::tests::threshold_issuance::session_continuation::session_reports::wire_and_normalized_approval_shape_checks_agree_for_all_combinations \
            -- cargo test --locked -p chio-kernel --features pq --lib threshold_issuance

      - name: Exact nonce validation and consumption boundary
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce validation and consumption boundary" --allow-filtered --expected \
            kernel::tests::nonce_admission::nonce_admission_reservation_checks_every_request_binding_before_consumption \
            kernel::tests::nonce_admission::nonce_admission_all_gates_reject_forged_signature_without_consumption \
            kernel::tests::nonce_admission::nonce_admission_validation_is_non_consuming_and_debug_is_opaque \
            kernel::tests::nonce_admission::nonce_admission_strict_reservation_requires_a_presented_nonce \
            kernel::tests::nonce_admission::nonce_admission_reservation_rejects_unsupported_schema_before_consumption \
            -- cargo test --locked -p chio-kernel --lib nonce_admission
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce expiry at consumption" --allow-filtered --expected \
            execution_nonce::tests::nonce_expiry_is_rechecked_when_reserved \
            -- cargo test --locked -p chio-kernel --lib nonce_expiry_is_rechecked_when_reserved

      - name: Exact durable nonce reservation
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable nonce reservation" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_is_atomic_fenced_and_replays_after_restart \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_rolls_back_on_operation_or_record_write_failure \
            admission_operation_store::tests::execution_nonce::durable_nonce_generic_cas_cannot_invent_or_advance_a_reservation \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_rechecks_issuer_and_expiry_before_mutation \
            admission_operation_store::tests::execution_nonce::durable_nonce_tampering_removal_and_oversized_storage_fail_reads_and_restart \
            admission_operation_store::tests::execution_nonce::durable_nonce_identity_cannot_be_updated_or_deleted \
            admission_operation_store::tests::execution_nonce::durable_nonce_expired_reservation_remains_available_only_as_history \
            admission_operation_store::tests::execution_nonce::durable_nonce_v11_migration_preserves_original_commits_without_inventing_reservations \
            admission_operation_store::tests::execution_nonce::durable_nonce_decoder_rejects_unbound_noncanonical_and_future_artifacts \
            admission_operation_store::tests::execution_nonce::durable_nonce_contenders_in_distinct_namespaces_share_one_replay_identity \
            -- cargo test --locked -p chio-store-sqlite --lib durable_nonce

      - name: Exact durable original request retention
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable original request retention" --allow-filtered --expected \
            admission_operation_store::tests::retained_request::retained_request_reopens_under_the_current_fence_with_exact_bytes \
            admission_operation_store::tests::retained_request::retained_request_insert_and_begin_commit_roll_back_together \
            admission_operation_store::tests::retained_request::retained_request_rejects_wrong_binding_fence_and_regressed_time \
            admission_operation_store::tests::retained_request::retained_request_cannot_be_backfilled_for_a_legacy_operation \
            admission_operation_store::tests::retained_request::retained_request_tampering_or_removal_fails_reads_and_restart \
            admission_operation_store::tests::retained_request::retained_request_decoder_is_bounded_strict_and_not_an_authenticator \
            admission_operation_store::tests::retained_request::retained_request_v9_migration_preserves_legacy_commits_without_inventing_context \
            admission_operation_store::tests::retained_request::retained_request_orphan_is_rejected_at_restart \
            admission_operation_store::tests::retained_request::retained_request_lookup_rejects_ambiguous_namespaces_even_without_legacy_material \
            admission_operation_store::tests::retained_request::retained_request_v10_migration_adds_bounded_lookup_and_preserves_original_bytes \
            -- cargo test --locked -p chio-store-sqlite --lib retained_request

      - name: Exact kernel collector restart lifecycle
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Kernel collector restart lifecycle" --expected \
            original_request_collects_after_reopen_and_execution_replays_once \
            collector_rechecks_revocation_after_voting_without_mutation \
            collector_rechecks_current_directory_and_original_submitter \
            original_context_requires_startup_and_policy_binding \
            invalid_capability_has_no_original_context_to_collect \
            collector_requires_original_admission_even_for_a_trusted_signed_proposal \
            collector_rejects_changed_policy_after_restart_without_mutation \
            collector_checks_operator_separation_rules_and_expiry_without_mutation \
            collector_rejects_policy_changes_during_original_context_resolution \
            -- cargo test --locked -p chio-store-sqlite --test threshold_kernel_lifecycle

      - name: Exact threshold session ownership
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Threshold session ownership" --allow-filtered --expected \
            session::threshold_continuation::tests::threshold_retry_claim_holds_lifecycle_and_authentication_until_commit \
            -- cargo test --locked -p chio-kernel --features pq --lib session::threshold_continuation::tests

      - name: Exact shared signing authority forwarding
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Shared signing authority forwarding" --allow-filtered --expected \
            kernel::signing_authority::forwarding_tests::shared_backend_forwards_every_atomic_signing_entrypoint \
            -- cargo test --locked -p chio-kernel --features pq --lib signing_authority::forwarding_tests

      - name: Exact boot-selected receipt signing
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Boot-selected receipt signing" --allow-filtered --expected \
            kernel::tests::boot_receipts::classical_inline_and_channel_receipts_remain_identical \
            kernel::tests::boot_receipts::hybrid_inline_receipt_uses_boot_verified_authority \
            kernel::tests::boot_receipts::hybrid_channel_receipt_uses_boot_verified_authority \
            kernel::tests::boot_receipts::hybrid_durable_dispatch_and_replay_retain_original_receipt \
            kernel::tests::boot_receipts::pq_required_capability_dispatch_produces_pq_receipt \
            kernel::tests::boot_receipts::pq_boot_denial_is_signed_without_dispatch \
            kernel::tests::boot_receipts::hybrid_inline_signer_refuses_changed_content \
            kernel::tests::boot_receipts::hybrid_channel_and_budget_fallback_refuse_changed_content \
            kernel::tests::boot_receipts::hybrid_budget_fallback_preserves_authority_and_byte_identity \
            kernel::tests::boot_receipts::hybrid_channel_refuses_stale_classical_identity \
            kernel::tests::boot_receipts::boot_reconfiguration_preserves_channel_shutdown \
            kernel::tests::boot_receipts::dropped_boot_handle_preserves_receipt_authority_without_issuer_trust \
            kernel::tests::boot_receipts::retained_hybrid_receipt_requires_original_authority_without_redispatch \
            kernel::tests::boot_receipts::hybrid_full_queue_fallback_uses_same_authority \
            kernel::tests::boot_receipts::failed_boot_quote_preserves_running_receipt_signer \
            kernel::tests::boot_receipts::failed_receipt_signing_recovers_tool_outcome_without_redispatch \
            kernel::tests::boot_receipts::capability_only_floor_setter_does_not_reconfigure_receipt_authority \
            kernel::tests::boot_receipts::hybrid_boot_preserves_separate_pool_receipt_authority \
            kernel::tests::boot_receipts::pq_boot_refuses_classical_pool_authority_without_substitution \
            kernel::tests::boot_receipts::session_reports_use_boot_selected_hybrid_authority \
            -- cargo test --locked -p chio-kernel --features pq,finding-market --lib boot_receipts

  session-reports:
    name: Kernel-owned session reports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: cmake perl pkg-config protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Exact kernel session reports
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Exact kernel session reports" --allow-filtered --expected \
            kernel::tests::session_reports::report_binds_original_operation_and_exact_content_without_caller_authority \
            kernel::tests::session_reports::report_tenant_is_explicit_session_snapshot_not_ambient_or_caller_metadata \
            kernel::tests::session_reports::unknown_or_mismatched_session_cannot_mint_a_report \
            kernel::tests::session_reports::repeated_failure_reports_have_distinct_signed_ids \
            kernel::tests::session_reports::missing_required_receipt_store_cannot_return_a_report \
            kernel::tests::session_reports::dead_writer_cannot_return_a_report \
            kernel::tests::session_reports::append_failure_cannot_return_or_locally_mirror_a_report \
            kernel::tests::session_reports::failed_signer_cannot_fall_back_to_an_independent_key \
            kernel::tests::session_reports::report_refuses_classical_signer_below_boot_floor \
            kernel::tests::threshold_issuance::session_continuation::session_reports::normalized_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_sync_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_async_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::failure_observation_preserves_pending_operation_and_approval_authority \
            kernel::tests::threshold_issuance::session_continuation::session_reports::wire_and_normalized_approval_shape_checks_agree_for_all_combinations \
            kernel::tests::boot_receipts::session_reports_use_boot_selected_hybrid_authority \
            kernel::tests::settlement_routing_tests::session_reports_never_seed_claim_route_or_invoke_settlement \
            -- cargo test --locked -p chio-kernel --features pq --lib session_reports

      - name: Exact receipt evaluation isolation
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Receipt evaluation isolation" --allow-filtered --expected \
            kernel::tests::receipt_scope_isolation::anonymous_async_receipt_cannot_inherit_a_concurrent_tenant \
            kernel::tests::receipt_scope_isolation::anonymous_nested_receipt_cannot_inherit_a_concurrent_tenant \
            kernel::tests::receipt_scope_isolation::nested_receipt_evaluations_clear_and_restore_both_authority_scopes \
            kernel::tests::receipt_scope_isolation::suspended_receipt_context_migrates_and_cleans_up_on_its_own_context \
            kernel::tests::receipt_scope_isolation::dropping_a_suspended_evaluation_does_not_clear_the_current_one \
            kernel::tests::receipt_scope_isolation::cancelled_session_evaluation_releases_only_its_receipt_context \
            -- cargo test --locked -p chio-kernel --features pq --lib receipt_scope_isolation

      - name: Exact stdio failure receipts
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Exact stdio failure receipts" --allow-filtered --expected \
            session_cli::tests::failure_receipts::conflict_receipt_uses_kernel_authority_and_policy \
            session_cli::tests::failure_receipts::conflict_receipt_is_recorded_before_response \
            session_cli::tests::failure_receipts::evaluator_failure_receipt_uses_kernel_authority \
            session_cli::tests::failure_receipts::evaluator_failure_is_observation_not_execution_decision \
            session_cli::tests::failure_receipts::evaluator_failure_observation_is_recorded_before_response \
            session_cli::tests::failure_receipts::successful_stdio_receipt_remains_kernel_owned \
            session_cli::tests::failure_receipts::evaluator_failure_preserves_original_completed_lineage \
            session_cli::tests::failure_receipts::conflict_receipt_survives_real_store_shutdown_and_reopen \
            session_cli::tests::failure_receipts::completed_and_failure_receipts_survive_real_store_shutdown_and_reopen \
            session_cli::tests::failure_receipts::failed_report_persistence_drops_response_without_substitute_receipt \
            -- cargo test --locked -p chio-cli --bin chio failure_receipts

      - name: Exact native pending approval delivery
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Native pending approval delivery" --allow-filtered --expected \
            session_cli::tests::pending_approval::pending_approval_transports_the_signed_proposal_without_dispatch \
            session_cli::tests::pending_approval::pending_approval_round_trip_resumes_the_original_request_once \
            session_cli::tests::pending_approval::pending_approval_projection_rejects_broken_shape_and_signed_content_bindings \
            session_cli::tests::pending_approval::pending_approval_projection_rejects_execution_authority \
            session_cli::tests::pending_approval::pending_approval_altered_retry_preserves_the_original_wait \
            -- cargo test --locked -p chio-cli --bin chio session_cli::tests::pending_approval

      - name: Exact pending approval wire schema
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Pending approval wire schema" --allow-filtered --expected \
            pending_approval::pending_approval_result_preserves_the_proposal_on_round_trip \
            pending_approval::pending_approval_result_rejects_missing_unknown_and_malformed_fields \
            pending_approval::pending_approval_frame_rejects_execution_nonce \
            -- cargo test --locked -p chio-core-types --test wire_protocol_schema pending_approval

  fips-smoke:
    name: chio-tee fips smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install native build dependencies
        uses: ./.github/actions/apt-install
        with:
