name: chio-tee-fips

on:
  pull_request:
    paths:
      - .github/workflows/chio-tee-fips.yml
      - crates/trust/chio-tee/**
      - crates/trust/chio-tee-frame/**
      - crates/core/chio-core-types/**
      - crates/core/chio-core/**
      - crates/kernel/chio-kernel/**
      - crates/kernel/chio-kernel-core/**
      - crates/platform/chio-store-sqlite/**
      - crates/products/chio-cli/**
      - spec/schemas/chio-wire/v1/**
      - tests/bindings/fixtures/protocol-primitives-v1.json
      - scripts/check-exact-cargo-test-inventory.py
      - scripts/run-exact-cargo-test-inventory.sh
      - Cargo.toml
      - Cargo.lock
  push:
    branches:
      - main
      - 'project/**'
    paths:
      - .github/workflows/chio-tee-fips.yml
      - crates/trust/chio-tee/**
      - crates/trust/chio-tee-frame/**
      - crates/core/chio-core-types/**
      - crates/core/chio-core/**
      - crates/kernel/chio-kernel/**
      - crates/kernel/chio-kernel-core/**
      - crates/platform/chio-store-sqlite/**
      - crates/products/chio-cli/**
      - spec/schemas/chio-wire/v1/**
      - tests/bindings/fixtures/protocol-primitives-v1.json
      - scripts/check-exact-cargo-test-inventory.py
      - scripts/run-exact-cargo-test-inventory.sh
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

concurrency:
  group: chio-tee-fips-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  threshold-crypto-floor:
    name: Threshold approval crypto floor
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: cmake perl pkg-config protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Exact threshold crypto-floor regressions
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          threshold_list_output="$(mktemp)"
          threshold_run_output="$(mktemp)"
          trap 'rm -f "${threshold_list_output}" "${threshold_run_output}"' EXIT
          cargo test --locked -p chio-kernel --features pq --lib threshold_crypto_floor \
            -- --list 2>&1 | tee "${threshold_list_output}"
          cargo test --locked -p chio-kernel --features pq --lib threshold_crypto_floor \
            -- --test-threads=1 2>&1 | tee "${threshold_run_output}"
          python3 scripts/check-exact-cargo-test-inventory.py \
            --label "Threshold crypto floor" --allow-filtered \
            --list-output "${threshold_list_output}" \
            --run-output "${threshold_run_output}" \
            kernel::tests::threshold_crypto_floor::classical_threshold_verifiers_agree_on_canonical_replay_identity \
            kernel::tests::threshold_crypto_floor::tool_threshold_verifier_enforces_pq_floor_independently \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_proposal_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_proposal_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_vote_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::pq_capability_cannot_authorize_classical_threshold_votes \
            kernel::tests::threshold_crypto_floor::shared_threshold_verifier_rejects_classical_proposal_with_hybrid_votes \
            kernel::tests::threshold_crypto_floor::tool_threshold_verifier_rejects_classical_proposal_with_hybrid_votes \
            kernel::tests::threshold_crypto_floor::all_hybrid_threshold_artifacts_preserve_replay_identity_under_pq_floor \
            kernel::tests::threshold_crypto_floor::algorithm_allowlist_matches_floor_semantics \
            kernel::tests::threshold_crypto_floor::tool_threshold_resolves_current_route_exactly_once \
            kernel::tests::threshold_crypto_floor::shared_threshold_resolves_current_route_exactly_once \
            kernel::tests::threshold_crypto_floor::tool_threshold_rejects_empty_and_oversized_sets_before_policy_lookup \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_oversized_set_before_policy_lookup \
            kernel::tests::threshold_crypto_floor::threshold_verifiers_enforce_replay_member_id_bounds \
            kernel::tests::threshold_crypto_floor::classical_envelopes_allow_omitted_ed25519_metadata \
            kernel::tests::threshold_crypto_floor::shared_threshold_rejects_vote_algorithm_metadata_substitution \
            kernel::tests::threshold_crypto_floor::empty_algorithm_allowlist_denies \
            kernel::tests::threshold_crypto_floor::hybrid_envelopes_require_explicit_consistent_metadata \
            kernel::tests::threshold_crypto_floor::allow_classical_rejects_hybrid_threshold_artifacts

      - name: Exact boot-gated threshold issuance
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Boot-gated threshold issuance" --allow-filtered --expected \
            kernel::tests::threshold_issuance::classical_boot_preserves_canonical_proposal \
            kernel::tests::threshold_issuance::hybrid_signing_config_debug_omits_seed \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_refreshes_stale_admission_time \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_rechecks_expiry_after_policy_lookup \
            kernel::tests::threshold_issuance::cumulative_proposal_clock_does_not_trust_future_artifact_time \
            kernel::tests::threshold_issuance::installed_hybrid_backend_signs_cumulative_proposal \
            kernel::tests::threshold_issuance::pq_required_proposal_uses_the_boot_verified_authority \
            kernel::tests::threshold_issuance::classical_installed_proposal_dispatches_and_replays_once \
            kernel::tests::threshold_issuance::hybrid_proposal_dispatches_and_replays_once \
            kernel::tests::threshold_issuance::returned_backend_drop_keeps_installed_authority \
            kernel::tests::threshold_issuance::failed_boot_reconfiguration_preserves_previous_authority_and_floor \
            kernel::tests::threshold_issuance::missing_seed_preserves_previous_authority_and_floor \
            kernel::tests::threshold_issuance::incompatible_installed_signer_denies_without_publishing_proposal \
            kernel::tests::threshold_issuance::pending_retry_rechecks_crypto_floor_without_reissuing_proposal \
            kernel::tests::threshold_issuance::pending_retry_rechecks_current_directory \
            kernel::tests::threshold_issuance::reconstructed_kernel_preserves_pending_hybrid_artifact_and_dispatch_identity \
            kernel::tests::threshold_issuance::reconstructed_kernel_without_signer_refuses_retained_hybrid_proposal \
            kernel::tests::threshold_issuance::rotated_authority_does_not_resign_retained_proposal \
            kernel::tests::threshold_issuance::pq_capability_without_boot_signer_cannot_publish_classical_proposal \
            kernel::tests::threshold_issuance::retained_request::cumulative_admission_retains_the_original_request_and_capability \
            kernel::tests::threshold_issuance::retained_request::rejected_capability_does_not_retain_original_request_material \
            kernel::tests::threshold_issuance::retained_request::cumulative_retry_cannot_backfill_missing_original_authority \
            kernel::tests::threshold_issuance::session_continuation::approved_session_retry_resumes_original_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::altered_session_operation_cannot_consume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::replacement_signed_proposal_cannot_take_over_session_wait \
            kernel::tests::threshold_issuance::session_continuation::missing_proposal_cannot_restart_pending_session_request \
            kernel::tests::threshold_issuance::session_continuation::changed_session_lineage_cannot_consume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::rotated_session_authentication_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::cancelled_session_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::draining_session_cannot_resume_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_revoked_capability \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_current_threshold_policy \
            kernel::tests::threshold_issuance::session_continuation::resumed_session_revalidates_approval_votes \
            kernel::tests::threshold_issuance::session_continuation::nested_sync_session_resumes_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::nested_async_session_resumes_threshold_request \
            kernel::tests::threshold_issuance::session_continuation::threshold_session_rejects_unsupported_durable_nonce_profile \
            kernel::tests::threshold_issuance::session_continuation::concurrent_threshold_retry_cannot_claim_same_session_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::normalized_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_sync_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::nested_async_conflict_preserves_threshold_wait \
            kernel::tests::threshold_issuance::session_continuation::session_reports::failure_observation_preserves_pending_operation_and_approval_authority \
            kernel::tests::threshold_issuance::session_continuation::session_reports::wire_and_normalized_approval_shape_checks_agree_for_all_combinations \
            -- cargo test --locked -p chio-kernel --features pq --lib threshold_issuance

      - name: Exact nonce validation and consumption boundary
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce validation and consumption boundary" --allow-filtered --expected \
            kernel::tests::nonce_admission::nonce_admission_reservation_checks_every_request_binding_before_consumption \
            kernel::tests::nonce_admission::nonce_admission_all_gates_reject_forged_signature_without_consumption \
            kernel::tests::nonce_admission::nonce_admission_validation_is_non_consuming_and_debug_is_opaque \
            kernel::tests::nonce_admission::nonce_admission_strict_reservation_requires_a_presented_nonce \
            kernel::tests::nonce_admission::nonce_admission_reservation_rejects_unsupported_schema_before_consumption \
            -- cargo test --locked -p chio-kernel --lib nonce_admission
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce expiry at consumption" --allow-filtered --expected \
            execution_nonce::tests::nonce_expiry_is_rechecked_when_reserved \
            -- cargo test --locked -p chio-kernel --lib nonce_expiry_is_rechecked_when_reserved

      - name: Exact durable nonce reservation
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable nonce reservation" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_is_atomic_fenced_and_replays_after_restart \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_rolls_back_on_operation_or_record_write_failure \
            admission_operation_store::tests::execution_nonce::durable_nonce_generic_cas_cannot_invent_or_advance_a_reservation \
            admission_operation_store::tests::execution_nonce::durable_nonce_reservation_rechecks_issuer_and_expiry_before_mutation \
            admission_operation_store::tests::execution_nonce::durable_nonce_tampering_removal_and_oversized_storage_fail_reads_and_restart \
            admission_operation_store::tests::execution_nonce::durable_nonce_identity_cannot_be_updated_or_deleted \
            admission_operation_store::tests::execution_nonce::durable_nonce_expired_reservation_remains_available_only_as_history \
            admission_operation_store::tests::execution_nonce::durable_nonce_v11_migration_preserves_original_commits_without_inventing_reservations \
            admission_operation_store::tests::execution_nonce::durable_nonce_decoder_rejects_unbound_noncanonical_and_future_artifacts \
            admission_operation_store::tests::execution_nonce::durable_nonce_contenders_in_distinct_namespaces_share_one_replay_identity \
            -- cargo test --locked -p chio-store-sqlite --lib execution_nonce::durable_nonce

      - name: Exact durable nonce lifecycle
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable nonce lifecycle" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_commits_with_real_capture_and_blocks_split_capture \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_preparation_requires_physical_budget_evidence \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_preparation_rolls_back_each_sql_cutpoint \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_capture_rolls_back_nonce_budget_and_dispatch_together \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_cancellation_requires_release_and_retains_tombstones \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_cancellation_and_terminal_projection_roll_back_together \
            admission_operation_store::tests::execution_nonce::lifecycle::durable_nonce_lifecycle_generic_cas_cannot_fake_postdispatch_participants \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_reopens_pending_committed_and_cancelled_with_current_fences \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_signed_terminal_paths_preserve_disposition \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_expired_capture_rolls_back_budget_and_can_still_cancel \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_history_rejects_missing_corrupt_and_oversized_phases \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_phase_rows_are_permanent_and_immutable \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_v12_migration_keeps_ready_history_without_inventing_commit \
            admission_operation_store::tests::execution_nonce::lifecycle::recovery::durable_nonce_lifecycle_capture_and_cancellation_have_one_atomic_winner \
            admission_operation_store::tests::execution_nonce::lifecycle::approval::durable_nonce_lifecycle_composed_approval_commits_or_cancels_with_its_effect \
            admission_operation_store::tests::execution_nonce::lifecycle::approval::durable_nonce_lifecycle_composed_approval_expiry_prevents_budget_capture \
            admission_operation_store::tests::execution_nonce::lifecycle::approval::durable_nonce_lifecycle_composed_approval_corruption_prevents_capture \
            admission_operation_store::tests::execution_nonce::lifecycle::approval::durable_nonce_lifecycle_composed_approval_rolls_back_when_nonce_commit_fails \
            -- cargo test --locked -p chio-store-sqlite --lib execution_nonce::lifecycle::

      - name: Exact durable nonce issuance
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable nonce issuance" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_is_exact_and_does_not_reserve_or_dispatch \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_cannot_be_replaced_even_after_expiry \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_generic_cas_cannot_forge_evidence \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_rejects_legacy_profiles_and_wrong_issuers \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_rolls_back_each_sql_cutpoint \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_reopens_with_current_fences_and_migrates_absence \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_reservation_requires_the_exact_retained_artifact \
            admission_operation_store::tests::execution_nonce::issuance::durable_nonce_issuance_is_permanent_and_detects_corruption \
            admission_operation_store::tests::execution_nonce::issuance::recovery::durable_nonce_issuance_v14_ready_cannot_gain_fresh_capture_authority \
            admission_operation_store::tests::execution_nonce::issuance::recovery::durable_nonce_issuance_v14_pending_capture_rolls_back_and_can_cancel \
            admission_operation_store::tests::execution_nonce::issuance::qualification::durable_nonce_issuance_candidates_for_one_operation_have_one_winner \
            admission_operation_store::tests::execution_nonce::issuance::qualification::durable_nonce_issuance_rejects_foreign_command_mutations \
            admission_operation_store::tests::execution_nonce::issuance::qualification::durable_nonce_issuance_rechecks_fences_and_original_provenance \
            -- cargo test --locked -p chio-store-sqlite --lib execution_nonce::issuance::

      - name: Exact durable nonce preflight ownership
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable nonce preflight ownership" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::preflight::durable_nonce_preflight_owns_and_reverses_a_distinct_physical_hold \
            admission_operation_store::tests::execution_nonce::preflight::durable_nonce_preflight_cannot_capture_invocations_or_money \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_ack_loss_requires_current_fences_and_never_reopens_cleanup \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_rolls_back_physical_and_operation_sql_cutpoints \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_rejects_generic_identity_and_attachment_forgery \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_rejects_changed_parent_request_and_grant_bindings \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_denial_records_no_physical_ownership \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_concurrent_exact_candidates_have_one_physical_reservation \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_ownership_is_permanent_and_corruption_fails_reads_and_restart \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_requires_original_provenance_and_cannot_start_after_issuance \
            admission_operation_store::tests::execution_nonce::preflight::qualification::durable_nonce_preflight_replay_callback_cannot_backfill_physical_ownership \
            admission_operation_store::tests::execution_nonce::preflight::recovery::durable_nonce_preflight_v15_issuance_is_history_not_fresh_authority \
            admission_operation_store::tests::execution_nonce::preflight::recovery::durable_nonce_preflight_v15_ready_cannot_reserve_or_prepare_capture \
            admission_operation_store::tests::execution_nonce::preflight::recovery::durable_nonce_preflight_v15_pending_capture_rolls_back_and_can_cancel \
            admission_operation_store::tests::execution_nonce::preflight::approval::durable_nonce_preflight_restores_composite_budgets_but_cleanup_does_not_grant_approval \
            -- cargo test --locked -p chio-store-sqlite --lib execution_nonce::preflight::

      - name: Exact nonce profile isolation
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce profile isolation" --allow-filtered --expected \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_rejects_legacy_consumption_after_admission \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_rejects_admission_after_legacy_consumption \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_requires_exact_operation_signature_context \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_rejects_schema_relabeling \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_checks_every_bound_field \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_checks_mint_bounds_and_canonical_decode \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_v13_ready_history_cannot_regain_authority \
            admission_operation_store::tests::execution_nonce::domain::durable_nonce_domain_v13_pending_capture_rolls_back_and_can_cancel \
            -- cargo test --locked -p chio-store-sqlite --lib execution_nonce::domain::

      - name: Exact nonce profile wire schema
        run: |
          set -euo pipefail
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Nonce profile wire schema" --allow-filtered --expected \
            operation_nonce::operation_nonce_schema_preserves_both_profiles_and_rejects_unknown_versions \
            -- cargo test --locked -p chio-core-types --test wire_protocol_schema operation_nonce::

      - name: Exact generated Rust primitive fixtures
        run: |
          set -euo pipefail
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Generated Rust primitive fixtures" --expected \
            generated_rust_shapes_parse_reject_and_round_trip_shared_fixtures \
            -- cargo test --locked -p chio-core-types --test protocol_primitives_generated

      - name: Exact threshold reservation qualification
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Threshold reservation qualification" --allow-filtered --expected \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_rejects_foreign_participant_attachments_atomically \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_replay_rechecks_the_exact_packet \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_replay_rechecks_expiry \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_rejects_future_issuance_before_mutation \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_replay_requires_durable_participant_evidence \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_exact_replay_preserves_rows_and_reopens \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_checks_each_token_window_before_mutation \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_replay_checks_token_expiry_before_proposal_expiry \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_sql_failures_roll_back_all_participants \
            admission_operation_store::tests::threshold_approval::qualification::threshold_reservation_replay_rejects_changed_or_missing_storage \
            -- cargo test --locked -p chio-store-sqlite --lib threshold_approval::qualification

      - name: Exact durable original request retention
        run: |
          set -euo pipefail
          ulimit -c 0
          umask 022
          export RUST_TEST_THREADS=1
          bash scripts/run-exact-cargo-test-inventory.sh \
            --label "Durable original request retention" --allow-filtered --expected \
            admission_operation_store::tests::retained_request::retained_request_reopens_under_the_current_fence_with_exact_bytes \
            admission_operation_store::tests::retained_request::retained_request_insert_and_begin_commit_roll_back_together \
            admission_operation_store::tests::retained_request::retained_request_rejects_wrong_binding_fence_and_regressed_time \
            admission_operation_store::tests::retained_request::retained_request_cannot_be_backfilled_for_a_legacy_operation \
            admission_operation_store::tests::retained_request::retained_request_tampering_or_removal_fails_reads_and_restart \
