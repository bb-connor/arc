name: Agent preview packaging

on:
  pull_request:
    paths:
      - ".github/workflows/agent-preview-package.yml"
      - "scripts/package-agent-preview.py"
      - "scripts/agent-preview-readme.md"
      - "scripts/check-agent-install.sh"
      - "scripts/tests/package-agent-preview.test.py"
      - "scripts/check-agent-preview-runtime.py"
      - "scripts/tests/agent-preview-runtime.test.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-preview-package.yml"
      - "scripts/package-agent-preview.py"
      - "scripts/agent-preview-readme.md"
      - "scripts/check-agent-install.sh"
      - "scripts/tests/package-agent-preview.test.py"
      - "scripts/check-agent-preview-runtime.py"
      - "scripts/tests/agent-preview-runtime.test.py"

permissions:
  contents: read

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate archive integrity and exclusions
        run: |
          bash -n scripts/check-agent-install.sh
          python3 scripts/tests/package-agent-preview.test.py
          python3 scripts/tests/agent-preview-runtime.test.py
