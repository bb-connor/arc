name: native-cage-regression-diagnostics
run-name: "Native cage diagnostics source=${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Exact public repository containing the diagnostic source
        required: true
        type: string
        default: bb-connor/arc
      source_sha:
        description: Full 40-character commit containing the tests under diagnosis
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-diagnostics:
    name: native Linux x86_64 cage regression diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate diagnostic-only inputs and initialize retained context
        id: inputs
        shell: bash
        env:
          DIAGNOSTIC_ARTIFACTS: ${{ runner.temp }}/native-cage-diagnostics
          DIAGNOSTIC_WORK: ${{ runner.temp }}/native-cage-diagnostic-work
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_ARTIFACTS}"
          printf 'DIAGNOSTIC_ARTIFACTS=%s\nDIAGNOSTIC_WORK=%s\n' "${DIAGNOSTIC_ARTIFACTS}" "${DIAGNOSTIC_WORK}" >> "${GITHUB_ENV}"
          python3 -I - <<'PY'
          import json, os, pathlib, platform
          keys = ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_WORKFLOW_REF",
                  "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                  "RUNNER_OS", "RUNNER_ARCH", "RUNNER_NAME",
                  "INPUT_SOURCE_REPOSITORY", "INPUT_SOURCE_SHA")
          context = {key: os.environ.get(key) for key in keys}
          context.update(schema="chio.native-cage-diagnostic-context.v1",
                         evidence_class="diagnostic-only-unattested",
                         uid=os.geteuid(), gid=os.getegid(), groups=os.getgroups(),
                         uname=list(platform.uname()))
          path = pathlib.Path(os.environ["DIAGNOSTIC_ARTIFACTS"]) / "workflow-context.json"
          path.write_text(json.dumps(context, indent=2, sort_keys=True) + "\n")
          PY
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = bb-connor/arc
          test "${INPUT_SOURCE_REPOSITORY}" = bb-connor/arc
          [[ "${INPUT_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = X64
          test "$(uname -s):$(uname -m)" = Linux:x86_64
          test "$(id -u)" -ne 0

      - name: Checkout this diagnostic definition without credentials
        id: definition
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: bb-connor/arc
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: diagnostic-definition

      - name: Checkout the exact candidate without credentials
        id: candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Install native and musl build prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' '+ sudo apt-get update'
            sudo apt-get update
            printf '%s\n' '+ sudo apt-get install --no-install-recommends -y build-essential binutils clang cmake libclang-dev libssl-dev musl-tools perl pkg-config'
            sudo apt-get install --no-install-recommends -y \
              build-essential binutils clang cmake libclang-dev libssl-dev \
              musl-tools perl pkg-config
            dpkg-query -W build-essential binutils clang cmake libclang-dev \
              libssl-dev musl-tools perl pkg-config
          } 2>&1 | tee "${DIAGNOSTIC_ARTIFACTS}/native-prerequisites.log"

      - name: Run full native cage targets and independent enforcement mutations
        id: diagnostics
        shell: bash
        env:
          EXPECTED_DEFINITION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I diagnostic-definition/scripts/run-native-cage-diagnostics.py \
            --candidate "${GITHUB_WORKSPACE}/candidate" \
            --definition "${GITHUB_WORKSPACE}/diagnostic-definition" \
            --expected-definition-sha "${EXPECTED_DEFINITION_SHA}" \
            --source-repository "${INPUT_SOURCE_REPOSITORY}" \
            --source-sha "${INPUT_SOURCE_SHA}" \
            --output "${DIAGNOSTIC_ARTIFACTS}" \
            --work "${DIAGNOSTIC_WORK}"

      - name: Retain terminal workflow step states
        if: ${{ always() }}
        shell: bash
        env:
          DIAGNOSTIC_ARTIFACTS: ${{ runner.temp }}/native-cage-diagnostics
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          DEFINITION_OUTCOME: ${{ steps.definition.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTIC_ARTIFACTS}"
          python3 -I - <<'PY'
          import json, os, pathlib
          states = {key.removesuffix("_OUTCOME").lower(): os.environ[key]
                    for key in ("INPUTS_OUTCOME", "DEFINITION_OUTCOME", "CANDIDATE_OUTCOME",
                                "PREREQUISITES_OUTCOME", "DIAGNOSTICS_OUTCOME")}
          root = pathlib.Path(os.environ["DIAGNOSTIC_ARTIFACTS"])
          (root / "workflow-step-states.json").write_text(
              json.dumps(states, indent=2, sort_keys=True) + "\n")
          if not (root / "result.json").exists():
              (root / "result.json").write_text(json.dumps({
                  "schema": "chio.native-cage-full-diagnostics.v1",
                  "evidence_class": "diagnostic-only-unattested",
                  "status": "incomplete", "reason": "diagnostic runner did not produce a terminal result",
                  "workflow_step_states": states}, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload raw diagnostics for every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-cage-diagnostics-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-cage-diagnostics
          if-no-files-found: error
          retention-days: 14
