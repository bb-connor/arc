name: enterprise-hardening

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/security/**"
      - "crates/core/chio-core-types/src/merkle.rs"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/platform/chio-control-plane/**"
      - "crates/platform/chio-manifest/**"
      - "crates/platform/chio-store-sqlite/**"
      - "crates/tooling/chio-conformance/**"
      - "formal/**"
      - "spec/schemas/**"
      - "tests/bindings/vectors/security/**"
      - "scripts/check-flow-security.sh"
      - "scripts/check-deception-security.sh"
      - "scripts/check-response-recovery.sh"
      - "scripts/check-keyring-transparency.sh"
      - "scripts/check-secret-broker-boundary.sh"
      - "scripts/check-cage-enforcement.sh"
      - ".github/workflows/enterprise-hardening.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: enterprise-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always

jobs:
  portable-contracts:
    name: enterprise portable contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
          rustup show active-toolchain

      - name: Install native prerequisites
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Gate contract self-tests
        run: |
          bash scripts/tests/check-flow-security.test.sh
          bash scripts/tests/check-deception-security.test.sh
          bash scripts/tests/check-response-recovery.test.sh
          bash scripts/tests/check-protocol-primitives-concurrency.test.sh

      - name: Key transparency behavior
        run: ./scripts/check-keyring-transparency.sh

      - name: Secret broker boundary behavior
        run: ./scripts/check-secret-broker-boundary.sh

      - name: Schema registry and generated bindings
        run: |
          ./scripts/check-chio-schema-registry.sh
          make codegen-check
          cargo xtask freeze-vectors --check

      - name: Native security conformance
        run: cargo test -p chio-conformance --all-targets

      - name: Strict changed-crate lint
        run: |
          cargo clippy \
            -p chio-core-types \
            -p chio-keyring \
            -p chio-secret-broker \
            -p chio-manifest \
            --all-targets -- -D warnings

  active-defense-security:
    name: active defense security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain

      - name: Install native prerequisites
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Apalache
        run: |
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Information-flow behavior and formal model
        run: ./scripts/check-flow-security.sh

      - name: Deception boundary behavior
        run: ./scripts/check-deception-security.sh

      - name: Response recovery behavior
        run: ./scripts/check-response-recovery.sh

      - name: Protocol primitive concurrency
        run: ./scripts/check-protocol-primitives-concurrency.sh

  linux-enforcement:
    name: enterprise real Linux enforcement
    runs-on: [self-hosted, linux, x64, chio-enterprise-security]
    timeout-minutes: 90
    env:
      CHIO_ENTERPRISE_SECURITY_RUNNER: "1"
      CARGO_TARGET_DIR: /tmp/chio-enterprise-cage-target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy
          rustup show active-toolchain

      - name: Verify designated runner contract
        run: |
          test "$(uname -s):$(uname -m)" = "Linux:x86_64"
          command -v cc
          test -r /proc/self/status
          python3 scripts/check-linux-enforcement-stack.py

      - name: Parent-child exec observation and cage probes
        run: ./scripts/check-cage-enforcement.sh

      - name: Strict cage lint
        run: cargo clippy -p chio-cage --all-targets --features real-linux-enforcement -- -D warnings
