name: CI
run-name: CI N=${{ github.event.pull_request.number }} E=${{ github.event.pull_request.head.sha }} B=${{ github.event.pull_request.base.sha }} M=${{ github.sha }}

# Required-check inventory (GitHub branch rulesets match by `name:` field,
# not job id).
#
#   required (reported check context names):
#     - "Build, lint, test"                                  # check job
#     - "MSRV build and test"                                # msrv job
#     - "cargo-vet (locked supply-chain audit)"              # cargo-vet job
#     - "cargo-deny (supply-chain bans/advisories/licenses)" # cargo-deny job
#
# PR-tier CI is intentionally fast and Linux-only: format, clippy, build, the
# workspace test lane, and the cheap structural gates. Heavier lanes live
# elsewhere: the Lean 4 / Aeneas / Creusot proof report, portable browser and
# mobile qualification, the polyglot SDK-parity lane, and workspace coverage
# run nightly in nightly.yml; formal model checking is path-scoped in
# apalache-safety.yml; Lean, Kani, and Rust verification metadata are
# path-scoped in formal-pr-smoke.yml and Kani also runs nightly; the JVM SDK
# build is path-scoped in jvm.yml; macOS coverage stays in
# release-binaries.yml for tag releases, where macOS artifact behavior is
# actually exercised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always
  CHIO_CI_RUSTFLAGS: "-D warnings -C link-arg=-Wl,--threads=1"
  CHIO_KANI_VERSION: 0.68.0
  # PR-tier proptest case count for the named invariants. The nightly tier
  # (4096) lives in .github/workflows/nightly.yml.
  PROPTEST_CASES: "256"

jobs:
  check:
    name: Build, lint, test
    runs-on: ubuntu-latest
    # Failsafe above the healthy-lane ceiling. A cold-cache serial run reached
    # the final Tokio smoke compile only after the full workspace, Iroh,
    # cognition-market, and Wasm suites had consumed 4h55. Keep the explicit
    # 6h bound so a healthy final smoke is not cancelled while it compiles.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler ripgrep zstd

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python workflow validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.26.0 referencing==0.37.0

      - name: Trusted security definition regressions
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 scripts/tests/check-security-definitions.test.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install web3 contract dependencies
        run: pnpm --dir contracts install --frozen-lockfile

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      # Gate the named capability-algebra invariants. The authoritative name
      # set is in the script itself; a silent rename of any invariant fn
      # fails this step before the workspace lane builds.
      - name: Proptest invariant coverage
        run: ./scripts/check-proptest-coverage.sh

      - name: Workspace structural gates
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          source scripts/structural-gates.sh
          run_gate bash scripts/tests/run-structural-gates.test.sh
          run_gate ./scripts/check-release-inputs.sh
          run_gate python3 scripts/tests/check-release-source-gates.test.py
          run_gate python3 scripts/tests/check-release-draft-assets.test.py
          run_gate python3 scripts/tests/release-provenance.test.py
          run_gate python3 scripts/tests/check-release-binary-sbom.test.py
          run_gate python3 scripts/tests/release-sbom-rescan.test.py
          run_gate python3 scripts/tests/macos-release-portability.test.py
          run_gate python3 scripts/tests/msrv-cache-target.test.py
          run_gate python3 scripts/check-native-protocol-ci.py
          run_gate python3 scripts/tests/check-native-protocol-ci.test.py
          run_gate python3 scripts/tests/process-consumer-jobs.test.py
          run_gate python3 scripts/tests/prepare-enforced-native-fixture.test.py
          run_gate python3 -m unittest discover -s integrations/required-agents/qualification -p 'test_*.py'
          run_gate ./scripts/check-web3-contract-parity.sh
          run_gate ./scripts/check-workspace-layering.sh
          run_gate python3 scripts/check-review-slices.py
          run_gate bash ./scripts/check-regression-tests.sh
          run_gate bash ./scripts/tests/check-regression-tests.test.sh
          run_gate python3 ./scripts/check-rust-toolchain-parity.py
          run_gate bash ./scripts/tests/check-rust-toolchain-parity.test.sh
          run_gate bash ./deploy/docker/chio-workspace/regenerate.sh --check
          run_gate python3 scripts/check-docker-build-contexts.py
          run_gate python3 scripts/tests/check-docker-build-contexts.test.py
          run_gate bash ./scripts/tests/check-sidecar-docker-context.test.sh
          run_gate bash ./scripts/tests/check-sidecar-image-workflow.test.sh
          run_gate python3 scripts/check-mutants-examine-globs.py
          run_gate bash scripts/tests/check-mutants-examine-globs.test.sh
          run_gate python3 scripts/check-rust-public-surface.py
          run_gate bash scripts/tests/check-rust-public-surface.test.sh
          run_gate python3 scripts/check-architecture-docs.py
          run_gate bash ./scripts/check-security-provenance.sh
          run_gate python3 ./scripts/check-enterprise-provenance.py
          run_gate python3 ./scripts/check-linux-enforcement-stack.py
          run_gate bash ./scripts/check-security-dependencies.sh
          run_gate bash ./scripts/tests/check-security-provenance.test.sh
          run_gate bash ./scripts/tests/check-enterprise-provenance.test.sh
          run_gate bash ./scripts/tests/check-linux-enforcement-stack.test.sh
          run_gate bash ./scripts/tests/check-security-dependencies.test.sh
          run_gate bash ./scripts/check-sre-metrics-registry.sh
          run_gate bash ./scripts/check-log-redaction.sh
          run_gate python3 ./scripts/tests/check-log-redaction.test.py
          run_gate bash ./scripts/check-http-egress-contract.sh
          run_gate bash ./scripts/tests/check-http-egress-contract.test.sh
          run_gate bash ./scripts/check-chio-proof-room-release-truth.sh
          run_gate python3 ./scripts/tests/check-proof-room-copy-scope.test.py
          run_gate bash ./scripts/tests/check-chio-proof-room-release-truth.test.sh
          run_gate bash ./scripts/check-chio-schema-registry.sh
          run_gate bash ./scripts/tests/check-chio-schema-registry.test.sh
          run_gate bash ./scripts/check-agent-web-proof-envelope-schema.sh
          run_gate bash ./scripts/tests/check-agent-web-proof-envelope-schema.test.sh
          run_gate bash ./scripts/tests/check-protocol-peer-negotiation.test.sh
          run_gate bash ./scripts/tests/check-consumer-boundaries.test.sh
          run_gate python3 scripts/tests/check-consumer-sdk-inventory.test.py
          run_gate python3 scripts/tests/check-fuzz-manifest-selection.test.py
          run_gate bash scripts/tests/check-drogon-consumer-gate.test.sh
          run_gate bash ./scripts/tests/check-flow-security.test.sh
          run_gate bash ./scripts/tests/check-deception-security.test.sh
          run_gate /bin/bash -p ./scripts/tests/check-temporal-security.test.sh
          run_gate bash ./scripts/tests/check-response-recovery.test.sh
          run_gate bash ./scripts/tests/check-cage-enforcement.test.sh
          run_gate python3 ./scripts/check-mcp-admin-credential-contract.py
          run_gate python3 ./scripts/tests/check-mcp-admin-credential-contract.test.py
          run_gate python3 ./scripts/check-security-ci-contract.py
          run_gate python3 ./scripts/tests/check-security-ci-contract.test.py
          run_gate python3 ./scripts/tests/trusted-ci-landing-regressions.test.py
          run_gate python3 ./scripts/tests/check-fips-ci-contract.test.py
          run_gate python3 ./scripts/tests/check-required-evidence-binding.test.py
          run_gate bash ./scripts/tests/check-rust-verification-gates.test.sh
          run_gate bash ./scripts/tests/formal-workflow-wiring.test.sh
          run_gate cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1
          run_gate bash ./scripts/check-corpus-metadata.sh
          run_gate bash ./scripts/tests/fuzz-budget-hard-halt.test.sh
          run_gate bash ./scripts/tests/check-proof-report.test.sh
          run_gate bash ./scripts/tests/lane-gate.test.sh
          run_gate bash ./scripts/check-liability-roster-enforcement.sh
          run_gate bash ./scripts/tests/check-liability-roster-enforcement.test.sh
          run_gate bash ./scripts/check-no-eip3009-broadcast.sh
          run_gate python3 scripts/check-accounting-arithmetic.py
          run_gate bash scripts/tests/check-accounting-arithmetic.test.sh
          run_gate python3 scripts/check-domain-separation.py
          run_gate bash scripts/tests/check-domain-separation.test.sh
          run_gate python3 scripts/check-security-clocks.py
          run_gate python3 scripts/tests/check-security-clocks.test.py
          run_gate python3 scripts/check-trust-boundaries.py
          run_gate python3 scripts/tests/check-trust-boundaries.test.py
          run_gate python3 scripts/check-negative-assertions.py
          run_gate bash scripts/tests/check-negative-assertions.test.sh
          run_gate python3 scripts/check-lint-parity.py
          run_gate bash scripts/tests/check-lint-parity.test.sh
          run_gate python3 scripts/check-rust-hardening.py
          run_gate python3 scripts/tests/check-rust-hardening.test.py
          run_gate python3 scripts/tests/rust-hardening-compiler-probes.py
          run_gate python3 scripts/check-wire-schemas.py
          run_gate cargo xtask errors regen --check
          run_gate bash scripts/tests/check-wire-schemas.test.sh
          run_gate python3 scripts/check-dependency-budget.py
          run_gate bash scripts/tests/check-dependency-budget.test.sh
          run_gate bash scripts/run-miri-crates.sh --list
          run_gate bash scripts/tests/run-miri-crates.test.sh
          run_gate bash ./scripts/check-release-overflow.sh
          run_gate bash ./scripts/tests/check-release-overflow.test.sh
          finish_gates

      - name: Formal traceability gate
        run: bash scripts/check-mapping.sh

      - name: Temporal security gate
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        shell: /bin/bash --noprofile --norc -p -e {0}
        run: |
          set -euo pipefail
          readonly temporal_runner="scripts/check-temporal-security.sh"
          readonly temporal_self_test="scripts/tests/check-temporal-security.test.sh"
          test -f "${temporal_runner}"
          test ! -L "${temporal_runner}"
          test -x "${temporal_runner}"
          test -f "${temporal_self_test}"
          test ! -L "${temporal_self_test}"
          test -x "${temporal_self_test}"
          printf '%s  %s\n' 'f91b0a9a91fca90a51fd5c016d09c20828a767f07a0c4f4962adcadd12b3811a' "${temporal_runner}" | /usr/bin/sha256sum --check --strict
          printf '%s  %s\n' '606697a21a5f9ed1ce3af96dc1734cb98c5e95ba441ea2e68441d8382bb29fe1' "${temporal_self_test}" | /usr/bin/sha256sum --check --strict
          /bin/bash -p "${temporal_self_test}"
          printf '%s  %s\n' 'f91b0a9a91fca90a51fd5c016d09c20828a767f07a0c4f4962adcadd12b3811a' "${temporal_runner}" | /usr/bin/sha256sum --check --strict
          /bin/bash -p "${temporal_runner}"

      - name: Anchor batch async witness lint
        run: bash ./scripts/check-anchor-batch-async-witness.sh

      - name: crate-path go-dark guard
        run: cargo xtask check crate-paths

      - name: formal mirror drift guard
        run: cargo xtask check formal-mirrors

      - name: proof coverage drift guard
        run: cargo xtask gen proof-coverage --check

      - name: Workspace format
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo fmt --all -- --check

      - name: Rust file hygiene
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          python3 scripts/check-rust-file-hygiene.py
          bash scripts/tests/check-rust-file-hygiene.test.sh

      - name: Stub surface hygiene
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          python3 scripts/check-stub-surfaces.py
          bash scripts/tests/check-stub-surfaces.test.sh
          bash scripts/tests/check-sdk-release-python-generated.test.sh
          bash scripts/tests/check-sdk-release-ts-bun.test.sh
          bash scripts/tests/conformance-matrix-peer-target.test.sh
          bash scripts/tests/qualify-release-provider-replay.test.sh
          bash scripts/tests/qualify-release-peer-smoke.test.sh
          bash scripts/tests/release-qualification-formal-tools.test.sh
          bash scripts/tests/release-npm-package-matrix.test.sh
          bash scripts/tests/release-pypi-package-matrix.test.sh
          bash scripts/tests/provider-fixture-claims.test.sh

      - name: Workspace clippy
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo clippy --workspace --lib --bins --examples -- -D warnings

      - name: Workspace build
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo build --workspace

      - name: Policy analysis self-check
        run: ./scripts/check-policy-analysis.sh target/debug/chio

      - name: Build Proof Room dashboard
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"
          cache-dependency-path: crates/products/chio-cli/dashboard/package-lock.json
          working-directory: crates/products/chio-cli/dashboard

      - name: Export Proof Room static UI
        working-directory: crates/products/chio-cli/dashboard
        run: npm run build

      - name: Transaction Passport fixture gate
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          CHIO_BIN: target/debug/chio
        run: bash ./scripts/check-chio-transaction-passport.sh

      - name: governed-x402-sim smoke (no-key)
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          CHIO_BIN: target/debug/chio
        run: bash examples/governed-x402-sim/smoke.sh

      - name: Proof Room launch acceptance package
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          CHIO_BIN: target/debug/chio
        run: |
          cargo xtask verify launch-acceptance --out target/proof-room/public-bundle
          bash ./scripts/tests/check-chio-proof-room-launch-acceptance.test.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Qualify enforcing host and prepare native consumer fixture
        uses: ./.github/actions/enforced-native-fixture
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"

      - name: Workspace tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          # Match the flow gate's fixture isolation; explicit races still run.
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --exclude chio-wasm-guards

      - name: Protocol peer-negotiation gate
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: ./scripts/check-protocol-peer-negotiation.sh

      - name: Durable consumer boundaries
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: ./scripts/check-consumer-boundaries.sh

      - name: chio-cli default build excludes iroh
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          if cargo tree -p chio-cli -e normal 2>/dev/null | grep -qE '[[:space:]]iroh v'; then
            echo "ERROR: iroh is present in the default chio-cli dependency tree" >&2
            echo "The default shipped binary must not link iroh; use --features iroh to opt in." >&2
            exit 1
          fi
          echo "OK: iroh is not linked into the default chio-cli binary"

      - name: chio-kernel default build excludes the finding-market lane
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          if cargo tree -p chio-kernel -e normal 2>/dev/null | grep -qE '[[:space:]]chio-swarm-authority v'; then
            echo "ERROR: the finding-market lane is present in the default chio-kernel tree" >&2
            echo "A kernel that never trades findings must not link the market lane; use --features finding-market to opt in." >&2
            exit 1
          fi
          echo "OK: the finding-market lane is not linked into the default chio-kernel"

      - name: chio-kernel compiles and lints in both market modes
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          # The no-market mode must be linted library-only. The kernel's
          # dev-dependency on chio-store-sqlite enables finding-market, so
          # any target set that builds dev-dependencies unifies the lane
          # back on and would leave the fail-closed stand-ins unchecked.
          cargo clippy -p chio-kernel --lib -- -D warnings
          cargo clippy -p chio-kernel --features finding-market --all-targets -- -D warnings

      - name: chio-cli iroh feature build and clippy
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          cargo build -p chio-cli --features iroh
          cargo clippy -p chio-cli --features iroh -- -D warnings

      - name: chio-cli iroh feature tests (keep the ~17 gated iroh_mount/relay tests alive)
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test -p chio-cli --features iroh --bin chio

      - name: control-plane default build includes the qualified cognition market
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          if ! cargo tree -p chio-control-plane -e normal 2>/dev/null | grep -E '[[:space:]]chio-finding(-verifier)? v' >/dev/null; then
            echo "ERROR: chio-finding is absent from the default control-plane dependency tree" >&2
            echo "The qualified cognition market must remain linked into the promoted default control plane." >&2
            exit 1
          fi
          echo "OK: the qualified cognition market is linked into the default control plane"

      - name: cognition-market promoted-default build, clippy, and tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          RUST_TEST_THREADS: "1"
        run: |
          umask 022
          cargo build -p chio-control-plane -p chio-store-sqlite -p chio-open-market
          cargo clippy -p chio-control-plane -p chio-store-sqlite -p chio-open-market -- -D warnings
          cargo test -p chio-control-plane --lib
          cargo test -p chio-store-sqlite
          cargo test -p chio-open-market
          cargo test -p chio-cli --bin chio finding
          cargo test -p chio-finding -p chio-finding-verifier

      - name: Wasm guards library tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test -p chio-wasm-guards --lib

      - name: Build Python guard WASM fixture
        run: |
          python3 -m pip install "componentize-py==$(cat .tooling/componentize-py.version)"
          ./sdks/guard/chio-guard-py/scripts/build-guard.sh

      - name: Wasm guards Python SDK round-trip tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test -p chio-wasm-guards --test py_guard_integration -- --nocapture

      - name: Patch hygiene
        run: git diff --check

      - name: Tokio console smoke
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0 --cfg tokio_unstable"
        run: cargo test -p chio-kernel --features tokio-console-smoke --test tokio_console_smoke

  kani-public-pr:
    name: kani-public-pr (all lane=pr harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify public Kani harness enrollment
        run: |
          python3 scripts/check-kani-public-harnesses.py
          python3 scripts/tests/check-kani-public-harnesses.test.py

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-kani
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-kani-tool-target
        run: |
          set -euo pipefail
          bash scripts/install-kani-toolchain.sh
          cargo kani --version

      - name: Verify all PR Kani harnesses
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: ./scripts/run-kani-manifest.sh --lane pr

  formal-proof-contract:
    name: Formal proof contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Lean 4 toolchain
        shell: bash
        env:
          ELAN_VERSION: v4.2.1
          ELAN_TARBALL_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "${ELAN_TARBALL_SHA256}  /tmp/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: Prime Lean 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < formal/lean4/Chio/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          (
            cd formal/lean4/Chio
            "$HOME/.elan/bin/lake" --version
          )

      - name: Verify formal proof contract
        run: ./scripts/check-formal-proofs.sh

  apalache-full-contract:
    uses: ./.github/workflows/apalache-safety.yml
    permissions:
      actions: read
      contents: read
      issues: write

  threat-model-coverage-contract:
    uses: ./.github/workflows/threat-model-coverage.yml

  nonce-fips-contract:
    uses: ./.github/workflows/chio-tee-fips.yml
    permissions:
      contents: read

  enterprise-security-contract:
    # CHIO_ENTERPRISE_HARDENING_BOOTSTRAP_SHA=6573b8980a1e5331028b7e688169f033a39d0384
    uses: bb-connor/arc/.github/workflows/enterprise-hardening.yml@6573b8980a1e5331028b7e688169f033a39d0384
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    with:
      source_repository: ${{ github.repository }}
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  security-contract-required:
    name: Security contract
    if: ${{ always() }}
    needs:
      - check
      - kani-public-pr
      - formal-proof-contract
      - apalache-full-contract
      - threat-model-coverage-contract
      - msrv
      - cargo-vet
      - cargo-deny
      - enterprise-security-contract
      - nonce-fips-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require every security dependency
        env:
          COMMITTED_LINUX_EVIDENCE_SHA: ${{ vars.CHIO_COMMITTED_LINUX_EVIDENCE_SHA }}
        run: |
          set -euo pipefail
          [[ "${COMMITTED_LINUX_EVIDENCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test '${{ needs.check.result }}' = success
          test '${{ needs.kani-public-pr.result }}' = success
          test '${{ needs.formal-proof-contract.result }}' = success
          test '${{ needs.apalache-full-contract.result }}' = success
          test '${{ needs.threat-model-coverage-contract.result }}' = success
          test '${{ needs.msrv.result }}' = success
          test '${{ needs.cargo-vet.result }}' = success
          test '${{ needs.cargo-deny.result }}' = success
          test '${{ needs.enterprise-security-contract.result }}' = success
          test '${{ needs.nonce-fips-contract.result }}' = success

  msrv:
    name: MSRV build and test
    runs-on: ubuntu-latest
    # Serialize compilation and isolate fixtures while preserving explicit
    # thread/process races. The serial lane passed all 1,134 control-plane
    # cases, then exhausted four hours during SQLite without a test failure.
    # Match the main workspace's bounded six-hour failsafe; do not shorten
    # coverage or increase fixture concurrency to fit the old job budget.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.95.0"
          cache: "false"

      - name: Resolve and check the MSRV cache target
        id: msrv-cache
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-msrv-target
        run: |
          python3 scripts/tests/msrv-cache-target.test.py
          # The pinned action joins each RHS to the workspace root. An absolute
          # RHS would be nested under that root instead of selecting this target.
          python3 - <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = Path(os.environ["CARGO_TARGET_DIR"]).resolve()
          relative_target = os.path.relpath(target, workspace)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"workspace=. -> {relative_target}\n")
          PY

      - name: Cache the actual MSRV build target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: ${{ steps.msrv-cache.outputs.workspace }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python workflow validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.26.0 referencing==0.37.0

      - name: Qualify enforcing host and prepare native consumer fixture
        uses: ./.github/actions/enforced-native-fixture
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-msrv-target
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"

      - name: MSRV workspace lane
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-msrv-target
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          RUST_TEST_THREADS: "1"
        run: |
          cargo build --workspace
          cargo test --workspace --exclude chio-conformance --exclude chio-wasm-guards --exclude chio-formal-diff-tests
          cargo test -p chio-formal-diff-tests --no-run
          cargo test -p chio-wasm-guards --lib

  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy
          rustup show active-toolchain
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: Verify source-bound fork and locked supply-chain audits
        run: bash scripts/check-supply-chain.sh

  cargo-deny:
    name: cargo-deny (supply-chain bans/advisories/licenses)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.4
      - name: cargo deny check advisories
        run: cargo deny check advisories
      - name: cargo deny check licenses
        run: cargo deny check licenses
      - name: cargo deny check sources
        # Enforces the [sources] block in deny.toml (unknown-registry =
        # "deny", unknown-git = "deny", explicit allow-registry +
        # allow-git lists). Without this step a new dependency from an
        # unapproved registry or git repo passes CI even though the
        # policy denies it.
        run: cargo deny check sources
      - name: cargo deny check bans
        run: cargo deny check bans
      - name: Check external wildcard dependencies
        run: python3 scripts/check-external-wildcard-deps.py
      - name: cargo deny duplicate baseline
        run: python3 scripts/check-cargo-deny-duplicate-baseline.py
