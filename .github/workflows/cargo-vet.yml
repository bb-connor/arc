name: cargo-vet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-cargo-vet', github.ref) || format('main-{0}-cargo-vet', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install cargo-vet
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-vet --locked --version 0.10.2

      - name: Check cargo-vet exemptions do not increase
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          # Force-pushes and the very first push to a new branch can leave
          # github.event.before as the all-zero SHA. In that case there is no
          # base to diff against, so fall back to comparing against itself
          # (i.e. accept the head verbatim) and rely on the justification gate
          # to catch any exemption growth on subsequent pushes.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha available for $EVENT_NAME; skipping exemption diff" >&2
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:supply-chain/config.toml" > "$RUNNER_TEMP/base-cargo-vet-config.toml"
          if python3 scripts/check-cargo-vet-exemptions.py \
            --base "$RUNNER_TEMP/base-cargo-vet-config.toml" \
            --head supply-chain/config.toml; then
            exit 0
          fi

          has_authorized_justification() {
            local endpoint="$1"
            gh api "$endpoint" --paginate --jq '
              .[]
              | select(
                  (
                    .author_association == "OWNER"
                    or .author_association == "MEMBER"
                    or .author_association == "COLLABORATOR"
                  )
                  and ((.body // "") | test("^cargo-vet-exemption-justification:"; "i"))
                )
              | .id
            ' | grep -q .
          }

          PR_NUMBERS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBERS=("$PR_NUMBER")
          else
            ASSOCIATED_PRS_JSON="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls")"
            jq -e 'type == "array"' <<< "$ASSOCIATED_PRS_JSON" > /dev/null
            mapfile -t PR_NUMBERS < <(
              jq -r \
                --arg head "$HEAD_SHA" \
                --arg base "$DEFAULT_BRANCH" \
                '.[]
                 | select(
                     .merge_commit_sha == $head
                     and .merged_at != null
                     and .base.ref == $base
                   )
                 | .number' <<< "$ASSOCIATED_PRS_JSON"
            )
            if [ "${#PR_NUMBERS[@]}" -eq 0 ]; then
              {
                echo "Net-new cargo-vet exemptions detected without an exact merged pull request."
                echo "Direct pushes cannot supply a justification comment; this push is rejected."
                echo "Open a pull request and add a cargo-vet-exemption-justification comment instead."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          for ASSOCIATED_PR_NUMBER in "${PR_NUMBERS[@]}"; do
            if has_authorized_justification "repos/$REPO/issues/$ASSOCIATED_PR_NUMBER/comments" \
              || has_authorized_justification "repos/$REPO/pulls/$ASSOCIATED_PR_NUMBER/comments" \
              || has_authorized_justification "repos/$REPO/pulls/$ASSOCIATED_PR_NUMBER/reviews"; then
              echo "cargo-vet exemption increase accepted by explicit PR #$ASSOCIATED_PR_NUMBER justification comment"
              exit 0
            fi
          done
          {
            echo "Net-new cargo-vet exemptions require a reviewer comment that starts with:"
            echo
            echo "cargo-vet-exemption-justification: <reason>"
            echo
            echo "Accepted locations: issue comments, pull request review comments, or pull request reviews from OWNER, MEMBER, or COLLABORATOR accounts."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: cargo vet --locked
        shell: bash
        run: |
          set -euo pipefail
          cargo vet --locked
