name: cargo-vet

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "labs/**/Cargo.toml"
      - "labs/**/Cargo.lock"
      - "deploy/docker/**/Cargo.lock"
      - "scripts/check-research-workspaces.py"
      - "scripts/research_workspaces.py"
      - "scripts/tests/check-research-workspaces.test.py"
      - "scripts/check-cargo-vet-exemptions.py"
      - "scripts/tests/check-cargo-vet-policy.test.py"
      - "scripts/tests/check-cargo-vet-exemptions.test.sh"
      - "supply-chain/**"
      - "third_party/aws-lc-rs-chio/**"
      - "scripts/check-aws-lc-fork.py"
      - "scripts/check-aws-lc-lints.py"
      - "scripts/tests/check-aws-lc-lints.test.py"
      - "scripts/check-supply-chain.sh"
      - "scripts/tests/check-aws-lc-fork.test.py"
      - "scripts/tests/check-supply-chain-workflows.test.py"
      - "scripts/render-vcpkg-release.py"
      - "scripts/tests/render-vcpkg-release.test.py"
      - "tools/vcpkg-overlay/**"
      - "docs/security/audits/**"
      - ".github/workflows/cargo-vet.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "labs/**/Cargo.toml"
      - "labs/**/Cargo.lock"
      - "deploy/docker/**/Cargo.lock"
      - "scripts/check-research-workspaces.py"
      - "scripts/research_workspaces.py"
      - "scripts/tests/check-research-workspaces.test.py"
      - "scripts/check-cargo-vet-exemptions.py"
      - "scripts/tests/check-cargo-vet-policy.test.py"
      - "scripts/tests/check-cargo-vet-exemptions.test.sh"
      - "supply-chain/**"
      - "third_party/aws-lc-rs-chio/**"
      - "scripts/check-aws-lc-fork.py"
      - "scripts/check-aws-lc-lints.py"
      - "scripts/tests/check-aws-lc-lints.test.py"
      - "scripts/check-supply-chain.sh"
      - "scripts/tests/check-aws-lc-fork.test.py"
      - "scripts/tests/check-supply-chain-workflows.test.py"
      - "scripts/render-vcpkg-release.py"
      - "scripts/tests/render-vcpkg-release.test.py"
      - "tools/vcpkg-overlay/**"
      - "docs/security/audits/**"
      - ".github/workflows/cargo-vet.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: cargo-vet-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal --component clippy
          rustup show active-toolchain

      - name: Install cargo-vet
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-vet --locked --version 0.10.2

      - name: Check cargo-vet exemptions do not increase
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          # Force-pushes and the very first push to a new branch can leave
          # github.event.before as the all-zero SHA. In that case there is no
          # base to diff against, so fall back to comparing against itself
          # (i.e. accept the head verbatim) and rely on the justification gate
          # to catch any exemption growth on subsequent pushes.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha available for $EVENT_NAME; skipping exemption diff" >&2
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:supply-chain/config.toml" > "$RUNNER_TEMP/base-cargo-vet-config.toml"
          git show "$BASE_SHA:supply-chain/audits.toml" > "$RUNNER_TEMP/base-cargo-vet-audits.toml"
          # A historical exemption justification never authorizes weakening the
          # actual audit policy. This check has no comment-based bypass.
          python3 scripts/check-cargo-vet-exemptions.py --policy-only \
            --base "$RUNNER_TEMP/base-cargo-vet-config.toml" \
            --base-audits "$RUNNER_TEMP/base-cargo-vet-audits.toml" \
            --head supply-chain/config.toml --head-audits supply-chain/audits.toml
          if python3 scripts/check-cargo-vet-exemptions.py \
            --base "$RUNNER_TEMP/base-cargo-vet-config.toml" \
            --base-audits "$RUNNER_TEMP/base-cargo-vet-audits.toml" \
            --head supply-chain/config.toml \
            --head-audits supply-chain/audits.toml; then
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "Net-new cargo-vet exemptions detected on a direct push to main."
              echo "Direct pushes cannot supply a justification comment; this push is rejected."
              echo "Open a pull request and request a cargo-vet-exemption-justification comment instead."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          has_authorized_justification() {
            local endpoint="$1"
            gh api "$endpoint" --paginate --jq '
              .[]
              | select(
                  (
                    .author_association == "OWNER"
                    or .author_association == "MEMBER"
                    or .author_association == "COLLABORATOR"
                  )
                  and ((.body // "") | test("^cargo-vet-exemption-justification:"; "i"))
                )
              | .id
            ' | grep -q .
          }

          if has_authorized_justification "repos/$REPO/issues/$PR_NUMBER/comments" \
            || has_authorized_justification "repos/$REPO/pulls/$PR_NUMBER/comments" \
            || has_authorized_justification "repos/$REPO/pulls/$PR_NUMBER/reviews"; then
            echo "cargo-vet exemption increase accepted by explicit PR justification comment"
            exit 0
          fi
          {
            echo "Net-new cargo-vet exemptions require a reviewer comment that starts with:"
            echo
            echo "cargo-vet-exemption-justification: <reason>"
            echo
            echo "Accepted locations: issue comments, pull request review comments, or pull request reviews from OWNER, MEMBER, or COLLABORATOR accounts."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify source-bound fork and locked supply-chain audits
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-supply-chain.sh
