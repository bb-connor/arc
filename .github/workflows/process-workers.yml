name: Chio process workers

on:
  pull_request:
    paths:
      - "crates/kernel/chio-process/**"
      - "crates/products/chio-cli/**"
      - "crates/platform/chio-control-plane/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/trust/chio-custody-hw/**"
      - "crates/guards/chio-guards/**"
      - "crates/protocol/chio-mcp-adapter/**"
      - "sdks/python/chio-process/**"
      - "sdks/python/chio-langgraph/**"
      - "sdks/python/chio-mini-swe/**"
      - "examples/mini-swe-recovery/**"
      - "sdks/typescript/packages/process/**"
      - "sdks/typescript/packages/ai-sdk-process/**"
      - "sdks/typescript/package.json"
      - "sdks/typescript/package-lock.json"
      - "examples/repository-review/**"
      - "examples/shared-resource-swarm/**"
      - "examples/process-starter/**"
      - "scripts/qualify-process-packages.py"
      - "scripts/check-process-dependencies.py"
      - "scripts/package-repository-review.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/process-workers.yml"
  push:
    branches: [main]
    paths:
      - "crates/kernel/chio-process/**"
      - "crates/products/chio-cli/**"
      - "crates/platform/chio-control-plane/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-kernel-core/**"
      - "crates/trust/chio-custody-hw/**"
      - "crates/guards/chio-guards/**"
      - "crates/protocol/chio-mcp-adapter/**"
      - "sdks/python/chio-process/**"
      - "sdks/python/chio-langgraph/**"
      - "sdks/python/chio-mini-swe/**"
      - "examples/mini-swe-recovery/**"
      - "sdks/typescript/packages/process/**"
      - "sdks/typescript/packages/ai-sdk-process/**"
      - "sdks/typescript/package.json"
      - "sdks/typescript/package-lock.json"
      - "examples/repository-review/**"
      - "examples/shared-resource-swarm/**"
      - "examples/process-starter/**"
      - "scripts/qualify-process-packages.py"
      - "scripts/check-process-dependencies.py"
      - "scripts/package-repository-review.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/process-workers.yml"
  workflow_dispatch:
    inputs:
      optimized_comparison:
        description: Run repeated upstream and shared-resource comparisons with the standard release profile
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: process-workers-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.optimized_comparison && 'optimized-comparison' || 'compatibility' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.optimized_comparison }}
    name: MCP process host recovery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - name: Default kernel and worker dependency boundary
        run: |
          python3 scripts/check-process-dependencies.py
          cargo test --locked -p chio-kernel --lib custody::tests
      - name: CLI host and real MCP worker recovery
        run: |
          umask 022
          cargo test --locked -p chio-cli --test process_host
          cargo test --locked -p chio-cli --test receipt_verify --test process_response_verify
          cargo test --locked -p chio-cli --test process_state
          cargo test --locked -p chio-guards --test output_sanitization
          cargo test --locked -p chio-mcp-adapter --lib
          cargo test --locked -p chio-cli --bin chio request_timeout
          cargo test --locked -p chio-cli --bin chio runner::socket::tests
          cargo test --locked -p chio-control-plane --lib prepared_directory
          cargo clippy --locked -p chio-cli --bin chio --test process_host --test receipt_verify --test process_response_verify -- -D warnings
          rustfmt --edition 2021 --check crates/products/chio-cli/src/cli/process_host.rs
          rustfmt --edition 2021 --check crates/products/chio-cli/src/cli/receipt_verify.rs
          rustfmt --edition 2021 --check crates/products/chio-cli/src/cli/process_response_verify.rs crates/products/chio-cli/tests/process_response_verify.rs
          cargo fmt -p chio-cli -- --check
      - name: Installed mini-SWE-agent recovery through Chio and Docker
        env:
          MSWEA_SILENT_STARTUP: "1"
        run: |
          uv sync --project sdks/python/chio-mini-swe --locked --extra dev
          sdks/python/chio-mini-swe/.venv/bin/ruff check --config sdks/python/chio-mini-swe/pyproject.toml sdks/python/chio-mini-swe sdks/python/chio-process examples/mini-swe-recovery
          sdks/python/chio-mini-swe/.venv/bin/ruff format --check --config sdks/python/chio-mini-swe/pyproject.toml sdks/python/chio-mini-swe sdks/python/chio-process examples/mini-swe-recovery
          sdks/python/chio-mini-swe/.venv/bin/ruff check --config sdks/python/chio-mini-swe/pyproject.toml crates/products/chio-cli/tests/process_host/container_runner.py crates/products/chio-cli/tests/process_host/container_worker.py
          sdks/python/chio-mini-swe/.venv/bin/ruff format --check --config sdks/python/chio-mini-swe/pyproject.toml crates/products/chio-cli/tests/process_host/container_runner.py crates/products/chio-cli/tests/process_host/container_worker.py
          uv build sdks/python/chio-process --wheel --out-dir "$RUNNER_TEMP/mini-swe-packages"
          uv build sdks/python/chio-mini-swe --wheel --out-dir "$RUNNER_TEMP/mini-swe-packages"
          uv pip install --python sdks/python/chio-mini-swe/.venv/bin/python --reinstall --no-deps "$RUNNER_TEMP/mini-swe-packages/chio_process-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/mini-swe-packages/chio_mini_swe-0.1.0-py3-none-any.whl"
          sdks/python/chio-mini-swe/.venv/bin/python -m pytest -q sdks/python/chio-mini-swe/tests sdks/python/chio-process/tests examples/mini-swe-recovery/test_session_environment.py examples/mini-swe-recovery/test_comparison_cleanup.py examples/mini-swe-recovery/test_optimized_build.py
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify.py --chio target/debug/chio --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_state.py --chio target/debug/chio --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/structured-state"
          docker --host unix:///var/run/docker.sock pull python:3.11-slim
          python3 examples/mini-swe-recovery/build_worker_image.py --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify.py --chio target/debug/chio --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/isolated"
          PYTHONPATH=sdks/python/chio-process/src python3 crates/products/chio-cli/tests/process_host/container_runner.py --chio target/debug/chio --image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/native-containers.json"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_native.py --chio target/debug/chio --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/native-mini-swe"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_operator.py --chio target/debug/chio --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/operator"
          python3 examples/mini-swe-recovery/build_repository_image.py --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/worker-image.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_operator.py --chio target/debug/chio --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --repository-service --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-operator"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_repository.py --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-failures"
          sdks/python/chio-mini-swe/.venv/bin/python examples/mini-swe-recovery/qualify_repository_storage.py --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-storage"
      - name: Installed coding session with explicit operator provisioning
        env:
          MSWEA_SILENT_STARTUP: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          umask 077
          session_install=$(mktemp -d /tmp/chio-session-install-XXXXXX)
          cp target/debug/chio "$session_install/chio"
          chmod 700 "$session_install/chio"
          uv pip freeze --python sdks/python/chio-mini-swe/.venv/bin/python > "$RUNNER_TEMP/coding-session-requirements.txt"
          uv venv --python /usr/bin/python3 "$session_install/venv"
          uv pip sync --link-mode copy --python "$session_install/venv/bin/python" "$RUNNER_TEMP/coding-session-requirements.txt"
          "$session_install/venv/bin/python" examples/mini-swe-recovery/prepare_session_environment.py
          "$session_install/venv/bin/python" examples/mini-swe-recovery/qualify_repository_scope.py --chio "$session_install/chio" --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-scope"
          "$session_install/venv/bin/python" examples/mini-swe-recovery/qualify_session.py --chio "$session_install/chio" --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/session"
          "$session_install/venv/bin/python" examples/mini-swe-recovery/qualify_session.py --scoped --chio "$session_install/chio" --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/scoped-session"
          "$session_install/venv/bin/python" examples/mini-swe-recovery/compare.py --chio "$session_install/chio" --worker-image-file "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/repository-images.json" --output "$RUNNER_TEMP/mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/upstream-comparison"
      - name: Keep mini-SWE-agent recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-swe-process-recovery
          path: ${{ runner.temp }}/mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Repository review through the public process host
        run: |
          umask 022
          uv sync --project sdks/python/chio-langgraph --locked --extra dev --extra process
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check examples/repository-review crates/products/chio-cli/tests/process_host/runner.py crates/products/chio-cli/tests/process_host/failures.py crates/products/chio-cli/tests/process_host/supervision.py crates/products/chio-cli/tests/process_host/mailbox_leases.py crates/products/chio-cli/tests/process_host/adaptive.py crates/products/chio-cli/tests/process_host/adaptive_worker.py
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --check examples/repository-review crates/products/chio-cli/tests/process_host/runner.py crates/products/chio-cli/tests/process_host/failures.py crates/products/chio-cli/tests/process_host/supervision.py crates/products/chio-cli/tests/process_host/mailbox_leases.py crates/products/chio-cli/tests/process_host/adaptive.py crates/products/chio-cli/tests/process_host/adaptive_worker.py
          node --check crates/products/chio-cli/tests/process_host/adaptive_leaf.mjs
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process pytest -q examples/repository-review/test_snapshot.py examples/repository-review/test_adaptive.py
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python examples/repository-review/qualify.py --chio target/debug/chio --output "$RUNNER_TEMP/repository-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python examples/repository-review/qualify_native.py --chio target/debug/chio --output "$RUNNER_TEMP/repository-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/native"
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python examples/repository-review/qualify_adaptive.py --chio target/debug/chio --output "$RUNNER_TEMP/repository-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/adaptive"
      - name: Installed Python and Node packages outside the checkout
        run: |
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check --config sdks/python/chio-process/pyproject.toml examples/process-starter scripts/qualify-process-packages.py
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --check --config sdks/python/chio-process/pyproject.toml examples/process-starter scripts/qualify-process-packages.py
          python3 scripts/qualify-process-packages.py --chio target/debug/chio --output "$RUNNER_TEMP/process-starter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C "$RUNNER_TEMP/process-starter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -czf "$RUNNER_TEMP/chio-process-starter.tar.gz" .
      - name: Shared-resource recovery through the public host
        run: |
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python examples/shared-resource-swarm/qualify_native.py --resource-ownership --chio target/debug/chio --output "$RUNNER_TEMP/shared-resource-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python examples/shared-resource-swarm/qualify_ownership.py --chio target/debug/chio --output "$RUNNER_TEMP/shared-resource-ownership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Keep nonsecret shared-resource recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-resource-recovery
          path: |
            ${{ runner.temp }}/shared-resource-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
            ${{ runner.temp }}/shared-resource-${{ github.run_id }}-${{ github.run_attempt }}/receipts.ndjson
            ${{ runner.temp }}/shared-resource-${{ github.run_id }}-${{ github.run_attempt }}/kernel.pub
            ${{ runner.temp }}/shared-resource-ownership-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
            ${{ runner.temp }}/shared-resource-ownership-${{ github.run_id }}-${{ github.run_attempt }}/receipts.ndjson
            ${{ runner.temp }}/shared-resource-ownership-${{ github.run_id }}-${{ github.run_attempt }}/kernel.pub
          if-no-files-found: warn
      - name: Offline adaptive review with installed SDKs
        run: |
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check scripts/package-repository-review.py
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --check scripts/package-repository-review.py
          python3 scripts/package-repository-review.py --chio target/debug/chio --output "$RUNNER_TEMP/chio-review-kit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -I "$RUNNER_TEMP/chio-review-kit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualify.py" --kit "$RUNNER_TEMP/chio-review-kit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C "$RUNNER_TEMP/chio-review-kit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -czf "$RUNNER_TEMP/chio-review-kit.tar.gz" .
      - name: Installed AI SDK 6 and 7 with native tool and model recovery
        run: |
          npm ci --prefix sdks/typescript --ignore-scripts --no-audit --no-fund
          npm run build --prefix sdks/typescript --workspace @chio-protocol/ai-sdk-process
          npm test --prefix sdks/typescript --workspace @chio-protocol/ai-sdk-process
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check --config sdks/python/chio-process/pyproject.toml sdks/typescript/packages/ai-sdk-process/qualification
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --check --config sdks/python/chio-process/pyproject.toml sdks/typescript/packages/ai-sdk-process/qualification
          python3 sdks/typescript/packages/ai-sdk-process/qualification/qualify.py --chio target/debug/chio --output "$RUNNER_TEMP/ai-sdk-process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Research swarm benchmark against a local-callback baseline
        run: |
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check --config sdks/python/chio-process/pyproject.toml sdks/typescript/packages/ai-sdk-process/benchmark
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --check --config sdks/python/chio-process/pyproject.toml sdks/typescript/packages/ai-sdk-process/benchmark
          node --check sdks/typescript/packages/ai-sdk-process/benchmark/chio_worker.mjs
          node --check sdks/typescript/packages/ai-sdk-process/benchmark/baseline_worker.mjs
          python3 sdks/typescript/packages/ai-sdk-process/benchmark/run.py --chio target/debug/chio --sdk ai7 --trials 1 --output "$RUNNER_TEMP/ai-sdk-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Keep the research swarm benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-sdk-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ai-sdk-benchmark-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Keep installed AI SDK process packages and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-sdk-process-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/ai-sdk-process-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Keep the offline adaptive review kit and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chio-review-kit-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/chio-review-kit.tar.gz
          if-no-files-found: error
      - name: Keep qualified process starter and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chio-process-starter-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/chio-process-starter.tar.gz
          if-no-files-found: error
      - name: Keep repository review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-review-recovery
          path: ${{ runner.temp }}/repository-review-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
  workers:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.optimized_comparison }}
    name: Authenticated Python and JavaScript workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - name: Client framing and lossless receipts
        run: |
          PYTHONPATH=sdks/python/chio-process/src python3 -m unittest discover -s sdks/python/chio-process/tests
          node --test sdks/typescript/packages/process/test/*.test.mjs
      - name: Process protocol and host crash recovery
        run: |
          umask 022
          cargo test --locked -p chio-process --features worker-server,mailboxes
          cargo clippy --locked -p chio-process --features worker-server,mailboxes --all-targets -- -D warnings
          cargo fmt -p chio-process -- --check
      - name: LangGraph application recovery
        run: |
          umask 022
          uv sync --project sdks/python/chio-langgraph --locked --extra dev --extra process
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process pytest -q sdks/python/chio-langgraph/tests
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff check --isolated --select E,F,I,UP,B --ignore E501 examples/shared-resource-swarm
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process ruff format --isolated --check examples/shared-resource-swarm
          uv run --project sdks/python/chio-langgraph --locked --extra dev --extra process python -m unittest discover -s examples/shared-resource-swarm -v
          cargo run --locked -p chio-process --features worker-server --example langgraph_report
      - name: LangGraph 0.6 compatibility
        run: |
          umask 022
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/chio-langgraph-compat" uv sync --project sdks/python/chio-langgraph --locked --extra dev --extra process
          uv pip install --python "$RUNNER_TEMP/chio-langgraph-compat/bin/python" --no-deps --require-hashes -r sdks/python/chio-langgraph/qualification/compatibility.txt
          uv pip check --python "$RUNNER_TEMP/chio-langgraph-compat/bin/python"
          "$RUNNER_TEMP/chio-langgraph-compat/bin/python" -m pytest -q sdks/python/chio-langgraph/tests
          "$RUNNER_TEMP/chio-langgraph-compat/bin/python" -m unittest discover -s examples/shared-resource-swarm -v
          CHIO_LANGGRAPH_PYTHON="$RUNNER_TEMP/chio-langgraph-compat/bin/python" CHIO_GRAPH_REPORT_OUTPUT="$PWD/target/langgraph-report-compat" cargo run --locked -p chio-process --features worker-server --example langgraph_report
      - name: Keep graph recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langgraph-process-recovery
          path: |
            target/langgraph-report/
            target/langgraph-report-compat/
          if-no-files-found: error
  optimized-comparison:
    name: Optimized native session and shared-resource dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.optimized_comparison }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.94.1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "false"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_LTO: "fat"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      CARGO_PROFILE_RELEASE_PANIC: "unwind"
      RUSTFLAGS: ""
      CARGO_ENCODED_RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      PYTHONDONTWRITEBYTECODE: "1"
      MSWEA_SILENT_STARTUP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the immutable full checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git config --get core.sparseCheckout || true)" != true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: mini-swe-standard-release-v1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - name: Build the standard release CLI and retain Cargo artifact metadata
        run: |
          umask 022
          cargo build --release --locked -p chio-cli --bin chio \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/optimized-cargo-messages.jsonl"
      - name: Install copied packages and prepare immutable local images
        run: |
          umask 077
          comparison_root="$RUNNER_TEMP/optimized-mini-swe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          comparison_install=$(mktemp -d /tmp/chio-optimized-install-XXXXXX)
          mkdir -p "$comparison_root/wheels"
          {
            echo "CHIO_COMPARISON_ROOT=$comparison_root"
            echo "CHIO_COMPARISON_INSTALL=$comparison_install"
          } >> "$GITHUB_ENV"
          cp target/release/chio "$comparison_install/chio"
          chmod 700 "$comparison_install/chio"
          uv export --project sdks/python/chio-mini-swe --locked --extra dev \
            --no-header --no-emit-project --no-emit-package chio-process \
            --output-file "$comparison_root/requirements.txt" > /dev/null
          uv build sdks/python/chio-process --wheel --out-dir "$comparison_root/wheels"
          uv build sdks/python/chio-mini-swe --wheel --out-dir "$comparison_root/wheels"
          uv venv --python /usr/bin/python3 "$comparison_install/venv"
          uv pip sync --link-mode copy --require-hashes --python "$comparison_install/venv/bin/python" \
            "$comparison_root/requirements.txt"
          uv pip install --link-mode copy --no-deps --python "$comparison_install/venv/bin/python" \
            "$comparison_root/wheels/chio_process-0.1.0-py3-none-any.whl" \
            "$comparison_root/wheels/chio_mini_swe-0.1.0-py3-none-any.whl"
          "$comparison_install/venv/bin/python" examples/mini-swe-recovery/prepare_session_environment.py
          "$comparison_install/venv/bin/python" -m pytest -q \
            examples/mini-swe-recovery/test_optimized_build.py
          docker --host unix:///var/run/docker.sock pull python:3.11-slim
          /usr/bin/python3 examples/mini-swe-recovery/build_worker_image.py \
            --output "$comparison_root/worker-image.json"
          /usr/bin/python3 examples/mini-swe-recovery/build_repository_image.py \
            --worker-image-file "$comparison_root/worker-image.json" \
            --output "$comparison_root/repository-images.json"
      - name: Measure installed shared-resource release dispatch twice
        run: |
          umask 077
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/mini-swe-recovery/capture_optimized_build.py \
            --cargo-messages "$RUNNER_TEMP/optimized-cargo-messages.jsonl" \
            --chio "$CHIO_COMPARISON_INSTALL/chio" \
            --wheels "$CHIO_COMPARISON_ROOT/wheels" \
            --output "$CHIO_COMPARISON_ROOT/dispatch-build-before.json"
          for dispatch_trial in first second; do
            "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/shared-resource-swarm/probe_dispatch.py \
              --chio "$CHIO_COMPARISON_INSTALL/chio" --build-profile release \
              --binary-source-commit "$GITHUB_SHA" --rounds 20 \
              --output "$CHIO_COMPARISON_ROOT/dispatch-$dispatch_trial"
          done
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/mini-swe-recovery/capture_optimized_build.py \
            --cargo-messages "$RUNNER_TEMP/optimized-cargo-messages.jsonl" \
            --chio "$CHIO_COMPARISON_INSTALL/chio" \
            --wheels "$CHIO_COMPARISON_ROOT/wheels" \
            --output "$CHIO_COMPARISON_ROOT/dispatch-build-after.json"
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHIO_COMPARISON_ROOT"])
          before = json.loads((root / "dispatch-build-before.json").read_text())
          after = json.loads((root / "dispatch-build-after.json").read_text())
          for field in ("binary", "source", "source_files_sha256", "python"):
              if before[field] != after[field]:
                  raise SystemExit(f"Dispatch build provenance changed: {field}")
          for trial in ("first", "second"):
              report = json.loads((root / f"dispatch-{trial}/report.json").read_text())
              if report["binary_sha256"] != before["binary"]["sha256"]:
                  raise SystemExit("Dispatch report does not match the verified binary")
              if not (
                  report["source_commit"] == report["binary_source_commit"] == os.environ["GITHUB_SHA"]
                  and report["build_profile"] == "release"
                  and report["verified_unique_receipts"] == 26
              ):
                  raise SystemExit("Dispatch source, profile or receipt count does not match")
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Verify build provenance and run both paths twice
        run: |
          umask 077
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/mini-swe-recovery/capture_optimized_build.py \
            --cargo-messages "$RUNNER_TEMP/optimized-cargo-messages.jsonl" \
            --chio "$CHIO_COMPARISON_INSTALL/chio" \
            --wheels "$CHIO_COMPARISON_ROOT/wheels" \
            --output "$CHIO_COMPARISON_ROOT/build-before.json"
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/mini-swe-recovery/compare.py \
            --chio "$CHIO_COMPARISON_INSTALL/chio" \
            --worker-image-file "$CHIO_COMPARISON_ROOT/repository-images.json" \
            --trials 2 --output "$CHIO_COMPARISON_ROOT/comparison"
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" examples/mini-swe-recovery/capture_optimized_build.py \
            --cargo-messages "$RUNNER_TEMP/optimized-cargo-messages.jsonl" \
            --chio "$CHIO_COMPARISON_INSTALL/chio" \
            --wheels "$CHIO_COMPARISON_ROOT/wheels" \
            --output "$CHIO_COMPARISON_ROOT/build-after.json"
          "$CHIO_COMPARISON_INSTALL/venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHIO_COMPARISON_ROOT"])
          before = json.loads((root / "build-before.json").read_text())
          after = json.loads((root / "build-after.json").read_text())
          comparison = json.loads((root / "comparison/comparison.json").read_text())
          if not (
              before["binary"] == after["binary"]
              and comparison["binary_sha256"] == before["binary"]["sha256"]
              and before["source"] == after["source"]
              and before["source_files_sha256"] == after["source_files_sha256"]
              and before["python"] == after["python"]
              and len(comparison["cases"]) == 8
          ):
              raise SystemExit("Comparison does not match the verified build and installation")
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Keep optimized comparison reports and build provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimized-mini-swe-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/build-before.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/build-after.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/dispatch-build-before.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/dispatch-build-after.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/dispatch-*/report.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/dispatch-*/receipts.ndjson
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/dispatch-*/kernel.pub
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/worker-image.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/repository-images.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/requirements.txt
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/comparison/input-identities.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/comparison/comparison.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/comparison/*-clean-*.json
            ${{ runner.temp }}/optimized-mini-swe-${{ github.run_id }}-${{ github.run_attempt }}/comparison/*-patch-return-crash-*.json
          if-no-files-found: warn
