              retry_checks="$(list_namespace_checks "${retry_token}" "${retry_app}" "${retry_name}")"
              test "$(jq -r '.total_count' <<< "${retry_checks}")" = 1
              retry_check="$(jq -cS '.check_runs[0]' <<< "${retry_checks}")"
              test "$(jq -r --arg app "${retry_app}" --arg slug "${retry_slug}" --arg name "${retry_name}" --arg external "${retry_external}" --arg head "${EVIDENCE_SHA}" '.name == $name and .external_id == $external and .head_sha == $head and (.app.id | tostring) == $app and .app.slug == $slug' <<< "${retry_check}")" = true
              retry_id="$(jq -r '.id' <<< "${retry_check}")"
