              retry_payload="$(jq -cS -n --arg name "${retry_name}" --arg external "${retry_external}" --arg text "${retry_text}" --arg completed "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" '{name: $name, external_id: $external, status: "completed", conclusion: "failure", completed_at: $completed, output: {title: "Chio security authority revoked", summary: "Authenticated authorizing finalizer retry failed; authority remains revoked.", text: $text}}')"
