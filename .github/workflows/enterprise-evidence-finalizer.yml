                  --silent \
                  --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${installation_token}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EVIDENCE_SHA}/check-runs?app_id=${SECURITY_APP_ID}&check_name=Security%20contract&filter=all&per_page=100&page=${page}"
              })"
              page_total="$(jq -r '.total_count' <<< "${page_response}")"
              [[ "${page_total}" =~ ^[0-9]+$ ]]
              if test -z "${total_count}"; then
                total_count="${page_total}"
              else
                test "${page_total}" = "${total_count}"
              fi
              page_checks="$(jq -cS '.check_runs' <<< "${page_response}")"
              test "$(jq -r 'type' <<< "${page_checks}")" = "array"
              collected_checks="$({
                jq -cS -n \
                  --argjson collected "${collected_checks}" \
                  --argjson page "${page_checks}" \
                  '$collected + $page'
              })"
              collected_count="$(jq -r 'length' <<< "${collected_checks}")"
              test "${collected_count}" -le "${total_count}"
              if test "${collected_count}" = "${total_count}"; then
                break
              fi
              test "$(jq -r 'length' <<< "${page_checks}")" = "100"
              page="$((page + 1))"
            done
            test "$(jq -r '[.[].id] | unique | length' <<< "${collected_checks}")" = "${total_count}"
            jq -cS -n \
              --argjson check_runs "${collected_checks}" \
              --argjson total_count "${total_count}" \
              '{check_runs: $check_runs, total_count: $total_count}'
          }
          existing_authority_checks="$(list_authority_checks)"
          test "$(jq -r '.check_runs | length' <<< "${existing_authority_checks}")" = "$(jq -r '.total_count' <<< "${existing_authority_checks}")"
          test "$({
            jq -r \
              --arg app_id "${SECURITY_APP_ID}" \
              --arg head_sha "${EVIDENCE_SHA}" \
              'all(.check_runs[];
                .name == "Security contract" and
                .head_sha == $head_sha and
                (.app.id | tostring) == $app_id and
                .app.slug == "chio-security-authority"
              )' <<< "${existing_authority_checks}"
          })" = "true"
          existing_authority_matches="$(jq -cS '.check_runs | sort_by(.id)' <<< "${existing_authority_checks}")"
          existing_authority_match_count="$(jq -r 'length' <<< "${existing_authority_matches}")"
          test "${existing_authority_match_count}" -le 1
          if test "${existing_authority_match_count}" = "1"; then
            test "$(jq -r '.[0].external_id' <<< "${existing_authority_matches}")" = "${EXTERNAL_ID}"
            test "$(jq -r '.[0].status' <<< "${existing_authority_matches}")" = "completed"
            test "$(jq -r '.[0].conclusion' <<< "${existing_authority_matches}")" = "success"
          fi

          summary="Dedicated chio-security-authority approval for ${EXTERNAL_ID}."
          authority_text="$(jq -cS --arg publication_digest "${PUBLICATION_BINDING_DIGEST}" '{
            schema: "chio.security-check-authority.v3", identity, identity_digest,
            merge_observations, publication_binding_digest: $publication_digest,
            source_ci: (.ci | {run_attempt, run_id, workflow_id}),
            required_check_run_ids: .ci.required_check_run_ids,
            aggregate_check_run_id: .ci.aggregate_check_run_id,
            ci_merge_binding: (.ci.merge_binding | {artifact_id,
              artifact_digest: (.artifact_digest | sub("^sha256:"; "")), binding_sha256})
          }' <<< "${canonical_binding}")"
          check_payload="$({
            jq -cS -n \
              --arg details_url "${publication_details_url}" \
              --arg external_id "${EXTERNAL_ID}" \
              --arg head_sha "${EVIDENCE_SHA}" \
              --arg summary "${summary}" \
              --arg text "${authority_text}" \
              '{
                conclusion: "success",
                details_url: $details_url,
                external_id: $external_id,
                head_sha: $head_sha,
                name: "Security contract",
                output: {
                  summary: $summary,
                  text: $text,
                  title: "Chio security authority"
                },
                status: "completed"
              }'
          })"
          revalidate_live_publication_head
          authority_created=false
          if test "${existing_authority_match_count}" = "1"; then
            check_run="$(jq -cS '.[0]' <<< "${existing_authority_matches}")"
          else
            require_publishable_ci
            revalidate_live_publication_head
            test "${FINALIZER_RUN_ATTEMPT}" = 1
            check_run="$({
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                --request POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${installation_token}" \
                -H "Content-Type: application/json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                --data-binary "${check_payload}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs"
            })"
            revalidate_live_publication_head
            authority_created=true
          fi
          require_publishable_ci
          check_run_id="$(jq -r '.id' <<< "${check_run}")"
          [[ "${check_run_id}" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r '.name' <<< "${check_run}")" = "Security contract"
          test "$(jq -r '.head_sha' <<< "${check_run}")" = "${EVIDENCE_SHA}"
          test "$(jq -r '.status' <<< "${check_run}")" = "completed"
          test "$(jq -r '.conclusion' <<< "${check_run}")" = "success"
          test "$(jq -r '.external_id' <<< "${check_run}")" = "${EXTERNAL_ID}"
          [[ "$(jq -r '.details_url' <<< "${check_run}")" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]]
          if test "${authority_created}" = true; then
            test "$(jq -r '.details_url' <<< "${check_run}")" = "${publication_details_url}"
          fi
          test "$(jq -r '.app.id' <<< "${check_run}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.app.slug' <<< "${check_run}")" = "chio-security-authority"
          test "$(jq -r '.output.title' <<< "${check_run}")" = "Chio security authority"
          test "$(jq -r '.output.summary' <<< "${check_run}")" = "${summary}"
          observed_authority_text="$(jq -cS '.output.text | fromjson' <<< "${check_run}")"
          test "${observed_authority_text}" = "${authority_text}"
          verified_check="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${installation_token}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}"
          })"
          test "$(jq -r '.name' <<< "${verified_check}")" = "Security contract"
          test "$(jq -r '.head_sha' <<< "${verified_check}")" = "${EVIDENCE_SHA}"
          test "$(jq -r '.status' <<< "${verified_check}")" = "completed"
          test "$(jq -r '.conclusion' <<< "${verified_check}")" = "success"
          test "$(jq -r '.external_id' <<< "${verified_check}")" = "${EXTERNAL_ID}"
          [[ "$(jq -r '.details_url' <<< "${verified_check}")" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]]
          test "$(jq -r '.app.id' <<< "${verified_check}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.app.slug' <<< "${verified_check}")" = "chio-security-authority"
          verified_authority_text="$(jq -cS '.output.text | fromjson' <<< "${verified_check}")"
          test "${verified_authority_text}" = "${authority_text}"
          require_publishable_ci
          require_publishable_ci
          revalidate_live_publication_head
          unset installation_token
          trap - EXIT
          echo "Dedicated Security contract published for ${EVIDENCE_SHA}; check run ${check_run_id}." >> "${GITHUB_STEP_SUMMARY}"
          }

          reconcile_bad_ci
          if test "${bad_ci_observed}" = false; then
            publish_success_authority
          else
            exit 1
          fi
