            echo "Bad current CI completion permanently tombstoned ${EXTERNAL_ID}." >> "${GITHUB_STEP_SUMMARY}"
            bad_ci_observed=true
            return 0
          }

          reconcile_bad_authorizing_finalizer() {
            bad_authorizing_finalizer_observed=false
            retry_namespace="$(list_namespace_checks "${installation_token}" "${SECURITY_APP_ID}" "Security contract")"
            test "$(jq -r '.total_count' <<< "${retry_namespace}")" -le 1
            if test "$(jq -r '.total_count' <<< "${retry_namespace}")" = 0; then
              return 0
            fi
            retry_authority="$(jq -cS '.check_runs[0]' <<< "${retry_namespace}")"
            test "$(jq -r --arg app_id "${SECURITY_APP_ID}" --arg head "${EVIDENCE_SHA}" --arg external_id "${EXTERNAL_ID}" '.name == "Security contract" and .head_sha == $head and .external_id == $external_id and (.app.id | tostring) == $app_id and .app.slug == "chio-security-authority" and .status == "completed" and .conclusion == "success"' <<< "${retry_authority}")" = true
            retry_metadata="$(jq -cS '.output.text | fromjson' <<< "${retry_authority}")"
            retry_identity="${IDENTITY_JSON}"
            retry_source_ci="$(jq -cS -n --arg run_id "${CI_RUN_ID}" --arg run_attempt "${CI_RUN_ATTEMPT}" --arg workflow_id "${CI_WORKFLOW_ID}" '{run_id: $run_id, run_attempt: $run_attempt, workflow_id: $workflow_id}')"
            test "$(jq -r --argjson identity "${retry_identity}" --argjson source_ci "${retry_source_ci}" --arg digest "${IDENTITY_DIGEST}" --argjson observations "$(jq -cS '.merge_observations' <<< "${canonical_binding}")" 'keys == ["aggregate_check_run_id", "ci_merge_binding", "identity", "identity_digest", "merge_observations", "publication_binding_digest", "required_check_run_ids", "schema", "source_ci"] and .schema == "chio.security-check-authority.v3" and .identity == $identity and .identity_digest == $digest and .merge_observations == $observations and .source_ci == $source_ci and (.publication_binding_digest | test("^[0-9a-f]{64}$"))' <<< "${retry_metadata}")" = true
            retry_details="$(jq -r '.details_url' <<< "${retry_authority}")"
            if [[ "${retry_details}" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/([1-9][0-9]*)/attempts/1$ ]]; then
              authorizing_finalizer_id="${BASH_REMATCH[1]}"
            else
              exit 1
            fi
            # Existing App authority and immutable attempt 1 bind this run.
            # No listing or same-title sibling can mint withdrawal authority.
            retry_api() {
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"
            }
            original_finalizer="$(retry_api "actions/runs/${authorizing_finalizer_id}/attempts/1")"
            retry_workflow_id="$(jq -r '.workflow_id' <<< "${original_finalizer}")"
            [[ "${retry_workflow_id}" =~ ^[1-9][0-9]*$ ]]
            original_finalizer_sha="$(jq -r '.head_sha' <<< "${original_finalizer}")"
            original_finalizer_title="$(jq -r '.display_title' <<< "${original_finalizer}")"
            [[ "${original_finalizer_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${original_finalizer_title}" =~ ^Enterprise\ evidence\ finalizer\ N=${PR_NUMBER}\ E=${EVIDENCE_SHA}\ M=${MERGE_COMMIT_SHA}\ S=${AUTHORIZED_SOURCE_SHA}\ K=[0-9a-f]{64}$ ]]
            require_authorizing_attempt() {
              test "$(jq -r --arg run_id "${authorizing_finalizer_id}" --arg workflow_id "${retry_workflow_id}" --arg attempt "$2" --arg head "${original_finalizer_sha}" --arg title "${original_finalizer_title}" --arg repository "${GITHUB_REPOSITORY}" '(.id | tostring) == $run_id and (.workflow_id | tostring) == $workflow_id and (.run_attempt | tostring) == $attempt and .path == ".github/workflows/enterprise-evidence-finalizer.yml" and .event == "workflow_dispatch" and .head_sha == $head and .head_branch == "main" and .display_title == $title and .actor.login == "github-actions[bot]" and .repository.full_name == $repository and .head_repository.full_name == $repository' <<< "$1")" = true
            }
            require_authorizing_attempt "${original_finalizer}" 1
            test "$(jq -r '.triggering_actor.login' <<< "${original_finalizer}")" = 'github-actions[bot]'
            retry_authorized_blob="$(retry_api "contents/.github/workflows/enterprise-evidence-finalizer.yml?ref=${SECURITY_DEFINITION_SHA}" | jq -r '.sha')"
            retry_original_blob="$(retry_api "contents/.github/workflows/enterprise-evidence-finalizer.yml?ref=${original_finalizer_sha}" | jq -r '.sha')"
            [[ "${retry_authorized_blob}" =~ ^[0-9a-f]{40}$ ]]
            test "${retry_original_blob}" = "${retry_authorized_blob}"
            original_finalizer_jobs="$(retry_api "actions/runs/${authorizing_finalizer_id}/attempts/1/jobs?filter=all&per_page=100")"
            test "$(jq -r --arg run_id "${authorizing_finalizer_id}" --arg head "${original_finalizer_sha}" '.total_count == 4 and (.jobs | length) == 4 and ([.jobs[].name] | sort) == (["validate unsigned enterprise Linux capture", "sign committed enterprise Linux migration evidence", "authorize dedicated Security contract publication", "reconcile exact merge authority contexts"] | sort) and all(.jobs[]; (.run_id | tostring) == $run_id and .head_sha == $head)' <<< "${original_finalizer_jobs}")" = true
            if test "${authorizing_finalizer_id}" = "${FINALIZER_RUN_ID}" &&
               test "${FINALIZER_RUN_ATTEMPT}" = 1 &&
               test "$(jq -r '.status' <<< "${original_finalizer}")" = in_progress; then
              # The current publisher must finish before its enclosing first
              # attempt can be completed. All three protected predecessors
              # must already be successful and no rerun may have started.
              test "$(jq -r 'all(.jobs[]; if .name == "reconcile exact merge authority contexts" then .status == "in_progress" and .conclusion == null else .status == "completed" and .conclusion == "success" end)' <<< "${original_finalizer_jobs}")" = true
              retry_own_current="$(retry_api "actions/runs/${authorizing_finalizer_id}")"
              require_authorizing_attempt "${retry_own_current}" 1
              test "$(jq -r '.status == "in_progress" and .conclusion == null' <<< "${retry_own_current}")" = true
              return 0
            fi
            test "$(jq -r '.status' <<< "${original_finalizer}")" = completed
            test "$(jq -r '.conclusion' <<< "${original_finalizer}")" = success
            test "$(jq -r 'all(.jobs[]; .status == "completed" and .conclusion == "success")' <<< "${original_finalizer_jobs}")" = true
            retry_current="$(retry_api "actions/runs/${authorizing_finalizer_id}")"
            retry_maximum="$(jq -r '.run_attempt' <<< "${retry_current}")"
            [[ "${retry_maximum}" =~ ^[1-9][0-9]*$ ]]
            test "${retry_maximum}" -le 100
            require_authorizing_attempt "${retry_current}" "${retry_maximum}"
            retry_fingerprint="$(jq -cS '{run_attempt, status, conclusion}' <<< "${retry_current}")"
            retry_complete=true
