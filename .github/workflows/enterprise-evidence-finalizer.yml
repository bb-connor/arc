              revalidate_denial_scope
              test "$(jq -r --arg id "${retry_id}" --arg app "${retry_app}" --arg slug "${retry_slug}" --arg name "${retry_name}" --arg external "${retry_external}" --arg head "${EVIDENCE_SHA}" --arg text "${retry_text}" '(.id | tostring) == $id and .name == $name and .external_id == $external and .head_sha == $head and (.app.id | tostring) == $app and .app.slug == $slug and .status == "completed" and .conclusion == "failure" and .output.text == $text' <<< "${retry_failed}")" = true
            }
            fail_existing_retry_namespace "${installation_token}" "${SECURITY_APP_ID}" chio-security-authority "Security contract" "${EXTERNAL_ID}"
          }

          revalidate_source_ci_checks() {
            local exact_ci suite_id jobs='[]' page=1 page_response page_jobs page_count total_count='' page_total
            local required_name required_key expected_check_id matches required_job check_id check_run check_url check_url_prefix
            exact_ci="$({
              curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${CI_RUN_ATTEMPT}"
            })"
            test "$(jq -r --arg run_id "${CI_RUN_ID}" --arg attempt "${CI_RUN_ATTEMPT}" \
              --arg workflow_id "${CI_WORKFLOW_ID}" --arg head "${EVIDENCE_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" --arg owner "${GITHUB_REPOSITORY_OWNER}" \
              --arg repository_id "${REPOSITORY_ID}" \
              --arg title "CI N=${PR_NUMBER} E=${EVIDENCE_SHA} B=$(jq -r '.base.sha' <<< "${canonical_binding}") M=$(jq -r '.merge_observations.ci' <<< "${canonical_binding}")" '
