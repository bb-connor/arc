              page_count="$(jq -r 'length' <<< "${page_jobs}")"
              jobs="$(jq -cS -n --argjson prior "${jobs}" --argjson page "${page_jobs}" '$prior + $page')"
              test "$(jq -r 'length' <<< "${jobs}")" -le "${total_count}"
