            [[ "${suite_id}" =~ ^[1-9][0-9]*$ ]]
            while true; do
              test "${page}" -le 10
              page_response="$({
                curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                  -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${CI_RUN_ATTEMPT}/jobs?filter=all&per_page=100&page=${page}"
              })"
              page_total="$(jq -er '.total_count | select(type == "number" and . >= 0 and floor == .)' <<< "${page_response}")"
              [[ "${page_total}" =~ ^(0|[1-9][0-9]*)$ ]]
              if test "${page_total}" -ge 1000; then
                echo "source CI job inventory reaches the 1,000-result listing ceiling" >&2
