                  -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${expected_check_id}"
              })"
              test "$(jq -r --arg id "${expected_check_id}" --arg name "${required_name}" \
                --arg head "${EVIDENCE_SHA}" --arg suite "${suite_id}" '
                  (.id | tostring) == $id and .name == $name and .head_sha == $head and
                  .status == "completed" and .conclusion == "success" and
                  (.app.id | tostring) == "15368" and .app.slug == "github-actions" and
                  (.check_suite.id | tostring) == $suite and .check_suite.head_sha == $head
                ' <<< "${check_run}")" = true
            done
          }

          require_publishable_ci() {
            reconcile_bad_ci
            test "${bad_ci_observed}" = false
            reconcile_bad_authorizing_finalizer
            test "${bad_authorizing_finalizer_observed}" = false
