name: setup-kani
description: >-
  Build pinned Kani 0.68.0 with the repository's catch_unwind codegen repair
  on Ubuntu 24.04 amd64. This is a patched source build, not an upstream release.
runs:
  using: composite
  steps:
    - name: Verify the runner profile and patch
      shell: bash
      env:
        RUNNER_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: |
        set -euo pipefail
        [[ "${RUNNER_PLATFORM}" == 'Linux-X64' ]]
        . /etc/os-release
        [[ "${ID:-}" == 'ubuntu' && "${VERSION_ID:-}" == '24.04' ]]
        [[ "$(dpkg --print-architecture)" == 'amd64' ]]
        [[ "${CHIO_KANI_VERSION:-}" == '0.68.0' ]]
        printf '%s  %s\n' \
          '84440a2046d1fc81bfdac1003c91a974103dc05b6fd5bb2435227b6024c5f2c4' \
          'formal/rust-verification/patches/kani-catch-unwind.patch' |
          sha256sum --check --strict

    - name: Check out and patch the pinned source
      shell: bash
      env:
        KANI_COMMIT: 0d2328a93f0e0ff66132d6bfa1a7d884877cf862
        CHARON_COMMIT: b250680abd40ff1aaa07081d0497dc2755ed112e
      run: |
        set -euo pipefail
        kani_src="${RUNNER_TEMP}/kani-src"
        patch_file="${GITHUB_WORKSPACE}/formal/rust-verification/patches/kani-catch-unwind.patch"
        if [[ -e "${kani_src}" || -L "${kani_src}" ]]; then
          echo "refusing pre-existing Kani source path: ${kani_src}" >&2
          exit 1
        fi
        git init "${kani_src}"
        git -C "${kani_src}" remote add origin https://github.com/model-checking/kani
        git -C "${kani_src}" fetch --depth 1 origin "${KANI_COMMIT}"
        git -C "${kani_src}" checkout --detach "${KANI_COMMIT}"
        [[ "$(git -C "${kani_src}" rev-parse HEAD)" == "${KANI_COMMIT}" ]]
        git -C "${kani_src}" submodule update --init charon
        [[ "$(git -C "${kani_src}/charon" rev-parse HEAD)" == "${CHARON_COMMIT}" ]]
        git -C "${kani_src}" apply --check "${patch_file}"
        git -C "${kani_src}" apply "${patch_file}"

    # Source is always fresh; this cache contains build outputs only.
    - name: Restore build outputs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/kani-src/target
        key: ubuntu-24.04-X64-kani-0d2328a93f0e0ff66132d6bfa1a7d884877cf862-${{ hashFiles('formal/rust-verification/patches/kani-catch-unwind.patch', '.github/actions/setup-kani/action.yml') }}

    - name: Install the pinned CBMC package
      shell: bash
      run: |
        set -euo pipefail
        package="${RUNNER_TEMP}/ubuntu-24.04-cbmc-6.11.0-Linux.deb"
        curl --fail --location --retry 3 --output "${package}" \
          https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb
        printf '%s  %s\n' \
          'b3721aa541038384d7801ea3aeabbcddc3e8845ac8f1cbff637cf8dec7481ac8' \
          "${package}" | sha256sum --check --strict
        sudo dpkg -i "${package}"
        rm -- "${package}"

    - name: Build the patched toolchain and verification libraries
      shell: bash
      run: |
        set -euo pipefail
        (
          cd "${RUNNER_TEMP}/kani-src"
          unset RUSTC RUSTDOC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS \
            CARGO_ENCODED_RUSTFLAGS RUSTDOCFLAGS CARGO_ENCODED_RUSTDOCFLAGS \
            CARGO_TARGET_DIR RUSTUP_TOOLCHAIN CARGO_BUILD_RUSTC \
            CARGO_BUILD_RUSTC_WRAPPER CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER \
            CARGO_BUILD_RUSTFLAGS CARGO_BUILD_RUSTDOCFLAGS CARGO_BUILD_TARGET \
            CARGO_BUILD_TARGET_DIR
          for variable in "${!CARGO_PROFILE_@}" "${!CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_@}"; do
            unset "${variable}"
          done
          export RUSTUP_TOOLCHAIN=nightly-2026-08-21
          rustup toolchain install nightly-2026-08-21 --profile minimal \
            --component llvm-tools --component rustc-dev --component rust-src --component rustfmt
          [[ "$(rustc --version)" == 'rustc 1.100.0-nightly (8925ea358 2026-08-20)' ]]
          export CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          cargo run --locked --target-dir target/tools -p build-kani -- build-dev --release --locked
        )

    - name: Select and verify the patched executable
      shell: bash
      run: |
        set -euo pipefail
        kani_scripts="${RUNNER_TEMP}/kani-src/scripts"
        export PATH="${kani_scripts}:${PATH}"
        [[ "$(command -v cargo-kani)" == "${kani_scripts}/cargo-kani" ]]
        version="$(bash "${GITHUB_WORKSPACE}/scripts/check-kani-toolchain.sh")"
        [[ "${version%%$'\n'*}" == *'-dirty) (cargo plugin)' ]]
        printf '%s\n' "${version}"
        echo "${kani_scripts}" >> "${GITHUB_PATH}"
