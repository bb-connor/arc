name: Prepared native broker consumers
description: Build host adapters, the static caged proxy and qualification service helper.
runs:
  using: composite
  steps:
    - name: Build bounded native broker transports
      shell: bash
      run: |
        set -euo pipefail
        umask 022
        cargo build --locked --profile docker-release -p chio-secret-broker --bin chio-docker-adapter --bin chio-repository-adapter
        cargo build --locked --target x86_64-unknown-linux-musl -p chio-secret-broker --bin chio-broker-mcp
        cargo test --locked --profile docker-release -p chio-secret-broker --features real-linux-enforcement --lib --no-run --message-format=json > "$RUNNER_TEMP/consumer-helper.jsonl"
        python3 - "$RUNNER_TEMP/consumer-helper.jsonl" "$GITHUB_ENV" <<'PY'
        import json, os, pathlib, sys
        records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
        binaries = [r["executable"] for r in records if r.get("reason") == "compiler-artifact" and r.get("target", {}).get("name") == "chio_secret_broker" and r.get("executable")]
        if len(binaries) != 1:
            raise SystemExit("Expected one native broker service helper")
        target = pathlib.Path(os.environ.get("CARGO_TARGET_DIR", "target")).resolve()
        with open(sys.argv[2], "a") as stream:
            for key, value in {
                "CHIO_BROKER_TEST_BINARY": binaries[0],
                "CHIO_BROKER_MCP_TOOL": target / "x86_64-unknown-linux-musl/debug/chio-broker-mcp",
                "CHIO_DOCKER_ADAPTER": target / "docker-release/chio-docker-adapter",
                "CHIO_REPOSITORY_ADAPTER": target / "docker-release/chio-repository-adapter",
            }.items():
                stream.write(f"{key}={value}\n")
        PY
