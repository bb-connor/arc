[merge_policy]
method = "merge_commit_only"
allowed_github_command = "gh pr merge <number> --merge"
forbidden_methods = ["squash", "rebase", "automerge"]
active_train_scope = "planning plus Lane B source integration only"
lane_a_evidence_scope = "post-Lane-B regeneration, not active evidence closure"
