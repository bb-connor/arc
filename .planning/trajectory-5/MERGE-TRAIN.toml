github_state_required_for_merge = true
local_simulation_is_merge_readiness = false
stop_on = [
  "draft_pr",
  "merge_state_not_clean",
  "failing_required_check",
  "pending_required_check",
  "missing_required_review",
  "unresolved_actionable_review_thread",
  "conflict",
]
tail_policy = "draft aggregate tails are quarantined and excluded from release and security review units"

