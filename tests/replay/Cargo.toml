[package]
name = "chio-replay-gate"
description = "Deterministic-replay corpus driver and golden infrastructure for the Chio kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_replay_gate"
path = "src/lib.rs"

[[bin]]
name = "chio-replay-gate"
path = "src/main.rs"

[dependencies]
chio-core-types = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "corpus_smoke"
path = "tests/corpus_smoke.rs"

[[test]]
name = "golden_byte_equivalence"
path = "tests/golden_byte_equivalence.rs"

[lints]
workspace = true
