[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chio-process"
version = "0.1.0"
description = "Authenticated local workers for the Chio process runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/chio_process"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
