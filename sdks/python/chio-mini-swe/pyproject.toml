[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chio-mini-swe"
version = "0.1.0"
description = "Durable Chio execution for the mini-SWE-agent coding loop"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["chio-process==0.1.0", "mini-swe-agent==2.4.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[tool.uv.sources]
chio-process = { path = "../chio-process" }

[tool.hatch.build.targets.wheel]
packages = ["src/chio_mini_swe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
