[package]
name = "chio-lambda-extension"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Detect-only Chio observer packaged as an AWS Lambda Extension. Exposes a localhost:9090 HTTP evaluator that runs portable capability evaluation and flushes unsigned observation records to DynamoDB on SHUTDOWN. It does not authorize calls or sign receipts."
repository = "https://github.com/backbay-labs/chio"
publish = false

# This crate is intentionally EXCLUDED from the main Chio workspace. Declaring
# our own `[workspace]` table makes cargo treat this directory as an
# independent workspace root so tooling such as `cargo build` resolves
# dependencies against our local `Cargo.lock` instead of the Chio root.
[workspace]

[patch.crates-io]
aws-lc-rs = { path = "../../../third_party/aws-lc-rs-chio" }

[[bin]]
name = "chio-lambda-extension"
path = "src/main.rs"

[dependencies]
chio-kernel-core = { path = "../../../crates/kernel/chio-kernel-core" }
chio-core-types = { path = "../../../crates/core/chio-core-types" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
http-body-util = "0.1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

aws-config = { version = "1.5", features = ["behavior-version-latest"] }
# The default `rustls` feature also enables legacy Hyper 0.14. Keep the
# current Hyper 1 / AWS-LC HTTPS client and the Tokio runtime explicitly.
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
overflow-checks = true
