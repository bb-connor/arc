schema = "chio.linux-enforcement-stack.v1"
reviewed_at = "2026-07-17"
reviewer = "Chio security review"
minimum_linux = "6.7"
minimum_landlock_abi = 4
supported_architectures = ["x86_64"]
required_kernel_features = ["landlock", "seccomp_filter", "openat2", "execveat", "memfd_seals", "o_path", "pidfd", "ptrace_traceexec"]

[nono]
name = "nono"
version = "0.53.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
repository = "https://github.com/always-further/nono"
tag = "v0.53.0"
commit = "c4b25b827330640cb95f85809d88d977191b42e7"
checksum = "ae7eb523cc2036e9ad6527411c3da5dc2172dc454cc3447a03b910420a39bfee"
license = "Apache-2.0"
default_network = "blocked"
partially_enforced = "reject"
caller_owned_path_fds = true
patch_required = true

[nono.patch]
directory = "third_party/nono-chio"
kind = "wrapper"
package_name = "nono-chio"
version = "0.53.0-chio.2"
status = "required"
source_sha256 = "82e9bbb67df62ee123353e92a7d91102837aea8bd3c5f32a508b8a4577594d95"
changes = ["return observed Landlock ABI and RulesetStatus", "reject partially enforced filesystem and network rules", "construct PathBeneath rules from caller-owned descriptors", "retain caller ownership through ruleset application", "grant directory listing without granting descendant file reads", "handle every filesystem and network right known to the detected ABI"]

[landlock]
name = "landlock"
version = "0.4.4"
source = "registry+https://github.com/rust-lang/crates.io-index"
repository = "https://github.com/landlock-lsm/rust-landlock"
tag = "v0.4.4"
commit = "89c56e2db04cf0a4d63e192e7b4371af516a1ccc"
checksum = "49fefd6652c57d68aaa32544a4c0e642929725bdc1fd929367cdeb673ab81088"
license = "MIT OR Apache-2.0"

[seccompiler]
name = "seccompiler"
version = "0.5.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
repository = "https://github.com/rust-vmm/seccompiler"
tag = "v0.5.0"
commit = "c3cf77d65815037931ae5bc2fca010713defdc8c"
checksum = "a4ae55de56877481d112a559bbc12667635fdaf5e005712fd4e2b2fa50ffc884"
license = "Apache-2.0 OR BSD-3-Clause"
