# Cargo aliases for workspace tasks.
#
# `cargo xtask <command>` dispatches into the xtask crate (xtask/), a
# clap-derived CLI. Run `cargo xtask --help` for the full noun-verb tree.
# Historical leaf spellings (validate-scenarios, freeze-vectors,
# eval-receipt-regen, codegen, errors regen, snippets regen) remain as aliases.
#
# The alias keeps the invocation stable across local and
# CI hosts; both forms (`cargo xtask ...` and `cargo run -p xtask -- ...`)
# resolve to the same binary.

[alias]
xtask = "run --quiet --package xtask --"

# Bundled SQLite is built without global memory statistics. With them enabled,
# every SQLite allocation in the process takes one shared mutex, serializing
# independent connections. Nothing in the workspace reads sqlite3_memory_used,
# the highwater mark or the heap limits, which depend on these statistics.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
