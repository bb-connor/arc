notes = [
  "The implementation-linked protocol core is the pure security decision surface plus bounded models for adjacent state transitions. Concrete platform effects are tracked as audited assumptions.",
  "The budget-admission and revocation-projection public Kani harnesses verify shared scalar projection functions called by both production backends or callers; they do not verify storage IO, mutation journals, snapshot freshness, or reservation-ledger transitions. The separate budget checked-add harness remains model-level.",
  "Reservation conservation has four independent enforcement surfaces: bounded Apalache interleavings, the pure ledger_apply transition with Kani, Creusot, and Lean witnesses, a debug-only concrete monetary-journal replay plus runtime-metadata check, and a stateful InMemoryBudgetStore property test. A separate public Kani harness pins ledger_is_terminal to no outstanding reservation plus at least one non-zero terminal disposition. The store test does not drive kernel lifecycle or receipts; the in-kernel drop_guard_disposition_table separately exercises the production hook and guard. The pure classifier and scalar admission are linked; production ledger linkage is not established.",
  "Lean assets are release evidence only when root-imported, sorry-free, and mapped to property_matrix entries.",
  "Creusot and Kani are required strict-CI lanes for production implementation linkage; public Kani harnesses target verify_capability, NormalizedScope::is_subset_of, resolve_matching_grants, evaluate, sign_receipt, and the shared budget and revocation admission projections.",
  "Aeneas production extraction pairs every registered decision-core, reservation-ledger, Merkle-walk, and economy-conversion function with a generated Lean equivalence theorem. Economy evidence proves scalar ceil and floor rounding only; collection conservation, production netting absorption, and P11 remain outside that theorem. The ledger theorem reaches the bounded transition model, while concrete runtime store linkage remains outside it.",
  "The post-admission drop lifecycle is model-checked at two invocations and one buffered child per invocation. Its evidence requires both a positive NoError result and every paired negative mutation producing a registered ITF counterexample.",
  "RevocationPropagation is checked nightly against callback-complete, canonical, signed traces captured at real kernel revocation commit, revocation admission, and receipt append boundaries. The full-state ITF is the sole state input, Apalache evaluates four non-vacuous invariant witnesses, every invariant has a registered real-runtime negative calibration, and ASSUME-TRACE-OBSERVER remains the explicit callback-completeness boundary.",
  "The cognition-market challenge slash allocator is covered by its registered public Kani harness in the multi-crate PR lane.",
  "Release-facing formal claims must name this manifest, the theorem inventory, and the audited assumptions.",
  "ReceiptBeforeAllow proves the abstract persist-before-publish ordering and its production replay exercises the native happy path. It does not discharge concrete cross-row crash recovery, which remains excluded until implementation trace validation and crash-reopen conservation gates establish refinement.",
  "Manual Rust-to-model hashes are enforced by cargo xtask check formal-mirrors; transliteration and abstraction-anchor records require review, but matching hashes do not prove semantic equivalence or modeled properties.",
  "The Rust relying-party inclusion walk is bound to the symbolic Lean walk by paired manual-mirror hashes, an authenticated generated-output Aeneas theorem for the scalar step, bounded Kani parity with unwinding assertions over every size and index from 0 through 8 and every path length from 0 through 3, with fully symbolic hash bytes and runtime-cross-checked concrete fixtures, and required Rust-TypeScript tamper differentials. Hash collision resistance remains ASSUME-SHA256.",
  "The treaty PredicateLang is a bounded post-validation abstraction over production-shaped federation inputs. Its Lean abstraction anchors are drift tripwires, not a Rust refinement proof.",
  "docs/formal/COVERAGE.md is the generated per-surface join of declared verification registries. It reports evidence identity and attribution without licensing claims beyond docs/reference/CLAIM_REGISTRY.md.",
  "Canonical JSON injectivity is proved over actual UTF-8 bytes for normalized signed-decimal integers, Unicode scalar strings, arrays, and ordered object entries. The symbolic receipt projection uses the 20 named ChioReceiptIdInput fields in checked UTF-16 order with production omission rules; production serde agreement for compound values and float-bearing cases remain audited assumptions.",
  "Distributed revocation evidence models signed-root gossip loss, duplication, reordering, skew, partition suspension, heal, and catch-up. StaleEvaluationDenied mirrors the production wall-clock freshness gate. RejectedRawEvaluationCountBound records that no raw evaluation-throughput bound is proved.",
  "The distributed production gate checks exact deterministic scalar trace projections for one pinned origin and one RevocationView. It is not full-state refinement, does not inject faults into the shipped transport, and does not establish multi-origin isolation in Rust.",
  "ASSUME-NETWORK-TRANSPORT and ASSUME-GOSSIP-FAIRNESS-PARTITION-BOUND remain required. Distributed evidence scopes their use but does not discharge either assumption.",
  "The wasm boundary theorems model Chio's core-module verdict and error dispatch, including advisory mode. They do not verify wasmtime or the Component Model implementation and do not establish full engine information-flow non-interference.",
]

